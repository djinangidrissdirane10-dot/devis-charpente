<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plan de charpente</title>
<style>
:root{
  --papier:#14304a;
  --papier-2:#0f2639;
  --trait:#f2efe6;
  --bois:#d9a066;
  --encre:#8fb3cf;
  --ligne:#27506f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--papier-2);color:var(--trait);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 12px;background:var(--papier-2);border-bottom:1px solid var(--ligne);font-size:13px;min-height:34px}
#status{color:var(--trait)}
#status.err{color:#ff8f7a;font-weight:600}
#info{color:var(--encre);white-space:nowrap}
#wrap{flex:1;position:relative;background:var(--papier);overflow:hidden}
#cv,#gl{position:absolute;left:0;top:0;touch-action:none}
#gl{display:none}
#ui3d{position:absolute;top:8px;right:8px;left:8px;display:none;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end}
#views3d{position:absolute;bottom:10px;left:8px;right:8px;display:none;gap:6px;justify-content:center;z-index:3;flex-wrap:wrap}
#views3d button{padding:9px 12px;border-radius:8px;border:1px solid var(--ligne);background:rgba(15,38,57,.88);color:var(--trait);font-size:13px;font-family:inherit}
#views3d button.on{background:var(--bois);color:#2a1a08;border-color:var(--bois);font-weight:600}
#ui3d button{padding:8px 11px;border-radius:8px;border:1px solid var(--ligne);background:rgba(15,38,57,.88);color:var(--trait);font-size:13px;font-family:inherit}
#ui3d button.on{background:var(--bois);color:#2a1a08;border-color:var(--bois);font-weight:600}
#bar{display:flex;gap:6px;padding:7px;background:var(--papier-2);border-top:1px solid var(--ligne);overflow-x:auto;-webkit-overflow-scrolling:touch}
#bar button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:7px 8px;border:1px solid var(--ligne);border-radius:8px;background:var(--papier);color:var(--trait);font-size:11px;font-family:inherit}
#bar button b{font-size:18px;font-weight:400;line-height:1}
#bar button:active{background:var(--ligne)}
#bar button.primary{background:var(--bois);color:#2a1a08;border-color:var(--bois);font-weight:600}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--papier-2);border-top:2px solid var(--bois);padding:14px 14px 18px;z-index:5;touch-action:pan-y}
#sheet.hidden{display:none}
#sheet h3{margin:0 0 10px;font-size:16px}
#sheet h4{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--encre);font-weight:600}
#sheet label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ligne);font-size:14px}
#sheet input[type=number],#sheet input[type=text]{width:100px;padding:7px;border-radius:6px;border:1px solid var(--ligne);background:var(--papier);color:var(--trait);font-size:16px;text-align:right}
#sheet input[type=checkbox]{width:22px;height:22px;accent-color:var(--bois)}
#sheet .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--ligne);font-size:14px}
#sheet .row span:last-child{font-weight:600;text-align:right}
#sheet .sw{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:8px;vertical-align:middle}
#sheet .shapes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#sheet .shapes button,#sheetClose{padding:12px;border-radius:8px;border:1px solid var(--ligne);background:var(--papier);color:var(--trait);font-size:14px;font-family:inherit}
#sheet .shapes button.on{background:var(--bois);color:#2a1a08;border-color:var(--bois);font-weight:600}
#sheetClose{width:100%;margin-top:12px;background:var(--bois);color:#2a1a08;border-color:var(--bois);font-weight:600}
#sheet .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
#sheet .swatches button{padding:0;border:2px solid var(--ligne);border-radius:8px;background:var(--papier);color:var(--trait);font-size:11px;font-family:inherit;overflow:hidden}
#sheet .swatches button.on{border-color:var(--bois)}
#sheet .swatches canvas{display:block;width:100%;height:42px}
#sheet .swatches span{display:block;padding:3px 0 4px}
#sheet .cut{padding:8px 10px;margin:6px 0;border-left:3px solid var(--bois);background:rgba(255,255,255,.05);font-size:13px;line-height:1.5}
#sheet .nav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
#sheet .nav button{flex:1;padding:9px 8px;border-radius:8px;border:1px solid var(--ligne);background:var(--papier);color:var(--trait);font-size:13px;font-family:inherit}
#sheet canvas.coupe{width:100%;background:#0f2639;border:1px solid var(--ligne);border-radius:8px}
#sheet .seg{display:flex;gap:4px}
#sheet .seg2{display:flex;gap:4px}
#sheet .seg2 button,#sheet .seg button{padding:7px 10px;border-radius:7px;border:1px solid var(--ligne);background:var(--papier);color:var(--trait);font-size:13px;font-family:inherit}
#sheet .seg button.on{background:var(--bois);color:#2a1a08;border-color:var(--bois);font-weight:600}
#sheet .note{font-size:12px;color:var(--encre);margin:8px 0 0;line-height:1.4}
#sheet .dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
#sheet .dirs button{min-height:46px;font-size:22px;border-radius:8px;border:1px solid var(--ligne);background:var(--papier);color:var(--trait);font-family:inherit}
#sheet .dirs button.on{background:var(--bois);color:#2a1a08;border-color:var(--bois)}
#sheet .dirs span{display:flex;align-items:center;justify-content:center;color:var(--encre);font-size:14px}
#sheet .dBtn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--ligne);background:var(--papier);color:var(--trait);font-size:14px;font-family:inherit}
#sheet .dBtn.main{flex:none;width:100%;margin-top:10px;background:var(--bois);color:#2a1a08;border-color:var(--bois);font-weight:600}
#sheet .dBtn:disabled{opacity:.4}
#sheet .dRow{display:flex;gap:8px;margin-top:8px}
#dInfo{font-size:14px;margin-bottom:6px}
#dSides{font-size:13px;color:var(--encre);margin-bottom:2px;overflow-x:auto;white-space:nowrap}
#dHint{font-size:13px;color:var(--bois);margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="status"></span><span id="info"></span></div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <canvas id="gl"></canvas>
    <div id="ui3d">
      <button id="gRot" class="on">⏸ Rotation</button>
      <button id="gCov" class="on">Couverture</button>
      <button id="gStr" class="on">Charpente</button>
      <button id="gSun">☀ Lumière 2</button>
    </div>
    <div id="views3d">
      <button id="v_p" class="on">3D</button><button id="v_top">Dessus</button><button id="v_av">Avant</button><button id="v_dr">Droite</button><button id="v_ar">Arrière</button><button id="v_ga">Gauche</button>
    </div>
    <div id="sheet" class="hidden"><div id="sheetBody"></div><button id="sheetClose">Masquer</button></div>
  </div>
  <div id="bar">
    <button id="bDims" class="primary"><b>✎</b>Cotes</button>
    <button id="bClose"><b>✓</b>Fermer</button>
    <button id="b3d"><b>◈</b>3D</button>
    <button id="bCouv"><b>▤</b>Matériaux</button>
    <button id="bSet"><b>⚙</b>Réglages</button>
    <button id="bRecap"><b>≡</b>Récap</button>
    <button id="bShapes"><b>▦</b>Formes</button>
    <button id="bProj"><b>▣</b>Projets</button>
    <button id="bUndo"><b>↶</b>Annuler</button>
    <button id="bClear"><b>⌫</b>Effacer</button>
    <button id="bPng"><b>⤓</b>PNG</button>
    <button id="bFit"><b>⌖</b>Cadrer</button>
  </div>
</div>

<script>
/* =====================================================================
   PLAN DE CHARPENTE — fermes à la camerounaise, toute forme de contour
   • contour des murs  →  débord  →  squelette droit (faîtages, arêtiers, noues)
   • fermes tous les 1,8 m : arbalétriers + entrait + fiches (triangulé)
   • demi-fermes aux croupes, pannes sur toutes les faces, lattes
   • nomenclature en bastaings / lattes de 5 m
   • vue 3D WebGL, caméra qui tourne à 360°, couverture texturée
   Unités : mètres.
   ===================================================================== */

/* ---------- Géométrie de base ---------- */
function area(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y;}return s/2;}

function cleanPoly(p){
  const a=p.map(q=>({x:q.x,y:q.y}));
  let changed=true;
  while(changed&&a.length>=3){
    changed=false;
    for(let i=0;i<a.length;i++){
      const p0=a[(i+a.length-1)%a.length],p1=a[i],p2=a[(i+1)%a.length];
      const d1x=p1.x-p0.x,d1y=p1.y-p0.y,d2x=p2.x-p1.x,d2y=p2.y-p1.y;
      const l1=Math.hypot(d1x,d1y),l2=Math.hypot(d2x,d2y);
      if(l1<1e-6||l2<1e-6){a.splice(i,1);changed=true;break;}
      const cr=(d1x*d2y-d1y*d2x)/(l1*l2),dt=(d1x*d2x+d1y*d2y)/(l1*l2);
      if(Math.abs(cr)<1e-6&&dt>0){a.splice(i,1);changed=true;break;}
    }
  }
  return a;
}

function cleanPolyF(p,flags){
  const a=p.map(q=>({x:q.x,y:q.y}));
  const f=p.map((q,i)=>!!(flags&&flags[i]));
  let changed=true;
  while(changed&&a.length>=3){
    changed=false;
    for(let i=0;i<a.length;i++){
      const n=a.length,pi=(i+n-1)%n;
      const p0=a[pi],p1=a[i],p2=a[(i+1)%n];
      const d1x=p1.x-p0.x,d1y=p1.y-p0.y,d2x=p2.x-p1.x,d2y=p2.y-p1.y;
      const l1=Math.hypot(d1x,d1y),l2=Math.hypot(d2x,d2y);
      let drop=false,keepPrev=true;
      if(l1<1e-6){drop=true;keepPrev=false;}
      else if(l2<1e-6){drop=true;}
      else{
        const cr=(d1x*d2y-d1y*d2x)/(l1*l2),dt=(d1x*d2x+d1y*d2y)/(l1*l2);
        if(Math.abs(cr)<1e-6&&dt>0)drop=true;
      }
      if(drop){f[pi]=keepPrev?f[pi]:f[i];a.splice(i,1);f.splice(i,1);changed=true;break;}
    }
  }
  return{poly:a,flags:f};
}

function segInter(a,b,c,d){
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  const o1=o(a,b,c),o2=o(a,b,d),o3=o(c,d,a),o4=o(c,d,b);
  return o1*o2<0&&o3*o4<0;
}
function selfIntersects(p){
  const n=p.length;
  for(let i=0;i<n;i++){
    const a=p[i],b=p[(i+1)%n];
    for(let j=i+1;j<n;j++){
      if(j===i+1||(i===0&&j===n-1))continue;
      if(segInter(a,b,p[j],p[(j+1)%n]))return true;
    }
  }
  return false;
}

/* Contour décalé vers l'extérieur de d (angles vifs : arêtes prolongées) */
function offsetOut(W,d){
  const n=W.length;
  if(d<=1e-9)return W.map(p=>({x:p.x,y:p.y}));
  const ed=W.map((a,i)=>{
    const b=W[(i+1)%n],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);
    return{d:{x:dx/l,y:dy/l},n:{x:-dy/l,y:dx/l}};
  });
  const E=[];
  for(let i=0;i<n;i++){
    const e1=ed[(i+n-1)%n],e2=ed[i];
    const k=1+e1.n.x*e2.n.x+e1.n.y*e2.n.y;
    if(k<1e-3)return null;
    E.push({x:W[i].x-d*(e1.n.x+e2.n.x)/k,y:W[i].y-d*(e1.n.y+e2.n.y)/k});
  }
  for(let i=0;i<n;i++){
    const a=E[i],b=E[(i+1)%n];
    if((b.x-a.x)*ed[i].d.x+(b.y-a.y)*ed[i].d.y<=1e-3)return null;
  }
  if(selfIntersects(E)||area(E)<=0)return null;
  return E;
}

/* Contour décalé vers l'extérieur de dist, angles à onglet : sert aux rives et gouttières
   (angles rentrants et sortants se raccordent exactement) */
function miterLoop(poly,dist){
  const n=poly.length;
  const nr=poly.map((a,i)=>{
    const b=poly[(i+1)%n],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;
    return{x:-dy/l,y:dx/l};
  });
  return poly.map((p,i)=>{
    const e1=nr[(i+n-1)%n],e2=nr[i];
    let k=1+e1.x*e2.x+e1.y*e2.y;
    if(k<0.15)k=0.15;
    return{x:p.x-dist*(e1.x+e2.x)/k,y:p.y-dist*(e1.y+e2.y)/k};
  });
}

/* ---------- Squelette droit ---------- */
function skeleton(poly0,pre,wts){
  const poly=pre?poly0.map(p=>({x:p.x,y:p.y})):cleanPoly(poly0);
  if(poly.length<3)return null;
  if(!pre&&area(poly)<0)poly.reverse();
  const n=poly.length;
  const edges=poly.map((a,i)=>{
    const b=poly[(i+1)%n],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);
    const d={x:dx/l,y:dy/l},nn={x:-d.y,y:d.x};
    return{id:i,a,b,len:l,d,n:nn,c:nn.x*a.x+nn.y*a.y,w:(wts&&wts[i]===0)?0:1};
  });
  const arcs=[];
  let alive=[];
  const pos=(v,t)=>({x:v.p.x+v.v.x*(t-v.t),y:v.p.y+v.v.y*(t-v.t)});

  function mk(p,t,eIn,eOut){
    const v={p:{x:p.x,y:p.y},t,eIn,eOut,prev:null,next:null,dead:false};
    const det=eIn.n.x*eOut.n.y-eIn.n.y*eOut.n.x;
    const dot=eIn.n.x*eOut.n.x+eIn.n.y*eOut.n.y;
    const par=Math.abs(det)<1e-9;
    v.v=par?((dot>0)?{x:eIn.w*eIn.n.x,y:eIn.w*eIn.n.y}:{x:0,y:0}):{x:(eIn.w*eOut.n.y-eOut.w*eIn.n.y)/det,y:(eOut.w*eIn.n.x-eIn.w*eOut.n.x)/det};
    const cr=eIn.d.x*eOut.d.y-eIn.d.y*eOut.d.x;
    v.reflex=cr<-1e-9;
    v.kind=(par&&dot<0)?'ridge':((par&&dot>0)?'flat':(cr<0?'valley':'hip'));   // « flat » : séparation entre deux pans coplanaires (côtés alignés), pas une vraie arête
    if(!par&&(eIn.w===0||eOut.w===0))v.kind='rake';
    v.reflex=v.reflex&&!(par&&dot>0);
    return v;
  }
  function addArc(v,pt,t){
    if(Math.hypot(pt.x-v.p.x,pt.y-v.p.y)<1e-6)return;
    arcs.push({a:{x:v.p.x,y:v.p.y},b:{x:pt.x,y:pt.y},ta:v.t,tb:t,kind:v.kind});
  }

  const V=poly.map((p,i)=>mk(p,0,edges[(i+n-1)%n],edges[i]));
  V.forEach((v,i)=>{v.prev=V[(i+n-1)%n];v.next=V[(i+1)%n];});
  alive=V.slice();
  let T=0,guard=0;

  function loops(){
    const seen=new Set(),res=[];
    for(const v of alive){
      if(seen.has(v))continue;
      const L=[];let c=v;
      do{seen.add(c);L.push(c);c=c.next;}while(c!==v&&L.length<10000);
      res.push(L);
    }
    return res;
  }

  function finish(L,t){
    const pts=[];
    for(const v of L){const pt=pos(v,t);addArc(v,pt,t);pts.push(pt);v.dead=true;}
    alive=alive.filter(v=>!v.dead);
    /* boucle d'aire nulle : ses côtés deviennent des faîtages (sans doublons) */
    const uniq=[];
    const uid=p=>{
      for(let i=0;i<uniq.length;i++)if(Math.hypot(uniq[i].x-p.x,uniq[i].y-p.y)<1e-6)return i;
      uniq.push({x:p.x,y:p.y});return uniq.length-1;
    };
    pts.forEach(uid);
    const seen=new Set();
    for(let i=0;i<pts.length;i++){
      const a=pts[i],b=pts[(i+1)%pts.length];
      const L=Math.hypot(b.x-a.x,b.y-a.y);
      if(L<1e-6)continue;
      const ux=(b.x-a.x)/L,uy=(b.y-a.y)/L;
      const on=[];
      uniq.forEach((q,k)=>{
        const s=(q.x-a.x)*ux+(q.y-a.y)*uy,cr=(q.x-a.x)*uy-(q.y-a.y)*ux;
        if(Math.abs(cr)<1e-6&&s>=-1e-6&&s<=L+1e-6)on.push({k,s});
      });
      on.sort((p,q)=>p.s-q.s);
      for(let j=0;j+1<on.length;j++){
        const k1=on[j].k,k2=on[j+1].k;
        if(k1===k2)continue;
        const key=k1<k2?k1+'_'+k2:k2+'_'+k1;
        if(seen.has(key))continue;
        seen.add(key);
        arcs.push({a:{x:uniq[k1].x,y:uniq[k1].y},b:{x:uniq[k2].x,y:uniq[k2].y},ta:t,tb:t,kind:'ridge'});
      }
    }
  }

  function finishLoops(t){
    let again=true;
    while(again){
      again=false;
      for(const L of loops()){
        let ar=0;
        if(L.length>2)ar=Math.abs(area(L.map(v=>pos(v,t))));
        if(L.length<=2||ar<1e-7){finish(L,t);again=true;break;}
      }
    }
  }

  function findEvent(){
    let best=null;
    for(const v of alive){
      const b=v.next,d=v.eOut.d;
      const pa=pos(v,T),pb=pos(b,T);
      const L=(pb.x-pa.x)*d.x+(pb.y-pa.y)*d.y;
      const rate=(b.v.x-v.v.x)*d.x+(b.v.y-v.v.y)*d.y;
      /* un côté de longueur nulle qui ne grandit pas doit s'effondrer tout de suite (deux événements simultanés :
         sinon la noue continue au-delà du croisement des deux noues) */
      const zeroLen=L<1e-6&&rate<=1e-9;
      if(rate<-1e-9||zeroLen){
        const t=zeroLen?T:T+Math.max(L,0)/(-rate);
        if(!best||t<best.t-1e-9)best={type:'edge',t,a:v,b};
      }
      if(v.reflex){
        const pr=pos(v,T);
        let a=v.next;
        while(a!==v){
          if(a.next!==v){
            const e=a.eOut,b2=a.next;
            const gap=e.n.x*pr.x+e.n.y*pr.y-(e.c+e.w*T);
            const closing=e.w-(e.n.x*v.v.x+e.n.y*v.v.y);
            if(closing>1e-9&&gap>-1e-6){
              const t=T+Math.max(gap,0)/closing;
              if(!best||t<best.t-1e-9){
                const H=pos(v,t),qa=pos(a,t),qb=pos(b2,t);
                const s1=(H.x-qa.x)*e.d.x+(H.y-qa.y)*e.d.y;
                const s2=(qb.x-H.x)*e.d.x+(qb.y-H.y)*e.d.y;
                if(s1>=-1e-4&&s2>=-1e-4)best={type:'split',t,r:v,a,b2,H};
              }
            }
          }
          a=a.next;
        }
      }
    }
    return best;
  }

  function apply(ev){
    const t=ev.t;
    if(ev.type==='edge'){
      const{a,b}=ev;
      const pa=pos(a,t),pb=pos(b,t);
      const E={x:(pa.x+pb.x)/2,y:(pa.y+pb.y)/2};
      addArc(a,E,t);addArc(b,E,t);
      const nv=mk(E,t,a.eIn,b.eOut);
      const pp=a.prev,nx=b.next;
      nv.prev=pp;nv.next=nx;pp.next=nv;nx.prev=nv;
      a.dead=b.dead=true;
      alive=alive.filter(v=>!v.dead);
      alive.push(nv);
    }else{
      const{r,a,b2,H}=ev;
      addArc(r,H,t);
      const e=a.eOut;
      const V1=mk(H,t,r.eIn,e),V2=mk(H,t,e,r.eOut);
      const rp=r.prev,rn=r.next;
      V1.prev=rp;rp.next=V1;V1.next=b2;b2.prev=V1;
      V2.prev=a;a.next=V2;V2.next=rn;rn.prev=V2;
      r.dead=true;
      alive=alive.filter(v=>!v.dead);
      alive.push(V1,V2);
    }
  }

  while(alive.length&&guard++<5000){
    const ev=findEvent();
    if(!ev){for(const L of loops())finish(L,T);break;}
    T=Math.max(T,ev.t);
    apply(ev);
    finishLoops(T);
  }
  return{poly,edges,arcs};
}

/* ---------- Pans de toiture (faces du squelette) ---------- */
function buildFaces(poly,arcs,wts){
  const nodes=[];
  const id=p=>{
    for(let i=0;i<nodes.length;i++)if(Math.hypot(nodes[i].x-p.x,nodes[i].y-p.y)<1e-4)return i;
    nodes.push({x:p.x,y:p.y});return nodes.length-1;
  };
  const seen=new Set(),list=[];
  const add=(a,b)=>{
    if(a===b)return;
    const k=a<b?a+'_'+b:b+'_'+a;
    if(seen.has(k))return;
    seen.add(k);list.push([a,b]);
  };
  const pid=poly.map(id);
  for(let i=0;i<poly.length;i++)if(!(wts&&wts[i]===0))add(pid[i],pid[(i+1)%poly.length]);
  arcs.forEach(a=>add(id(a.a),id(a.b)));
  const adj=nodes.map(()=>[]);
  list.forEach(([a,b])=>{
    adj[a].push({to:b,ang:Math.atan2(nodes[b].y-nodes[a].y,nodes[b].x-nodes[a].x)});
    adj[b].push({to:a,ang:Math.atan2(nodes[a].y-nodes[b].y,nodes[a].x-nodes[b].x)});
  });
  adj.forEach(l=>l.sort((x,y)=>x.ang-y.ang));
  const vis=new Set(),faceOf=new Map(),rings=[];
  for(let u=0;u<nodes.length;u++){
    for(const h of adj[u]){
      if(vis.has(u+'>'+h.to))continue;
      const ring=[];let a=u,b=h.to,guard=0;
      while(!vis.has(a+'>'+b)&&guard++<5000){
        vis.add(a+'>'+b);ring.push(a);faceOf.set(a+'>'+b,rings.length);
        const l=adj[b],idx=l.findIndex(x=>x.to===a);
        const nx=l[(idx-1+l.length)%l.length].to;
        a=b;b=nx;
      }
      rings.push(ring);
    }
  }
  const out=[];let sum=0;
  for(let i=0;i<poly.length;i++){
    if(wts&&wts[i]===0){out.push(null);continue;}
    const f=faceOf.get(pid[i]+'>'+pid[(i+1)%poly.length]);
    if(f===undefined)return null;
    const pts=rings[f].map(k=>({x:nodes[k].x,y:nodes[k].y}));
    const ar=area(pts);
    if(ar<=1e-6)return null;
    sum+=ar;out.push(pts);
  }
  if(Math.abs(sum-area(poly))>1e-3*Math.max(1,area(poly)))return null;
  return out;
}

function inTri(p,a,b,c){
  const s=(p1,p2,p3)=>(p1.x-p3.x)*(p2.y-p3.y)-(p2.x-p3.x)*(p1.y-p3.y);
  const d1=s(p,a,b),d2=s(p,b,c),d3=s(p,c,a);
  const neg=d1<-1e-9||d2<-1e-9||d3<-1e-9,pos=d1>1e-9||d2>1e-9||d3>1e-9;
  return !(neg&&pos);
}
function triangulate(poly0){
  const P=cleanPoly(poly0);
  if(P.length<3)return[];
  const idx=P.map((_,i)=>i),tris=[];
  let guard=0;
  while(idx.length>3&&guard++<20000){
    let found=false;
    for(let i=0;i<idx.length;i++){
      const i0=idx[(i+idx.length-1)%idx.length],i1=idx[i],i2=idx[(i+1)%idx.length];
      const a=P[i0],b=P[i1],c=P[i2];
      if((b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)<=1e-9)continue;
      let ok=true;
      for(const j of idx){
        if(j===i0||j===i1||j===i2)continue;
        if(inTri(P[j],a,b,c)){ok=false;break;}
      }
      if(ok){tris.push([i0,i1,i2]);idx.splice(i,1);found=true;break;}
    }
    if(!found){tris.push([idx[idx.length-1],idx[0],idx[1]]);idx.splice(0,1);}
  }
  if(idx.length===3)tris.push(idx.slice());
  return tris.map(t=>t.map(i=>P[i]));
}

/* ---------- Outils de calepinage ---------- */
function rayHit(o,d,arcs){
  let best=Infinity;
  for(const s of arcs){
    const ex=s.b.x-s.a.x,ey=s.b.y-s.a.y;
    const den=d.x*ey-d.y*ex;
    if(Math.abs(den)<1e-9)continue;
    const wx=s.a.x-o.x,wy=s.a.y-o.y;
    const t=(wx*ey-wy*ex)/den;
    const u=(wx*d.y-wy*d.x)/den;
    if(t>1e-6&&u>=-1e-6&&u<=1+1e-6&&t<best)best=t;
  }
  return best;
}

/* Coupe d'un pan par une ligne parallèle à l'égout, à la distance « off » */
function clipRow(poly,e,off){
  const lvl=e.c+off+1e-7;
  const ts=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const da=e.n.x*a.x+e.n.y*a.y-lvl,db=e.n.x*b.x+e.n.y*b.y-lvl;
    if((da<0&&db>=0)||(da>=0&&db<0)){
      const t=da/(da-db),x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
      ts.push({s:e.d.x*x+e.d.y*y,x,y});
    }
  }
  ts.sort((p,q)=>p.s-q.s);
  const segs=[];
  for(let i=0;i+1<ts.length;i+=2)segs.push([{x:ts[i].x,y:ts[i].y},{x:ts[i+1].x,y:ts[i+1].y}]);
  return segs;
}

/* Noms des pièces pour le plan de débit */
const TNAME={arb:'Arbalétrier',ent:'Entrait',fiche:'Fiche',retro:'Entrait retroussé',tAret:'Ferme d\u2019arêtier',tNoue:'Ferme de noue',tFait:'Ferme de faîtière',
  pannage:'Latte de pannage',sab:'Sablière',lAret:'Latte d\u2019arêtier',lNoue:'Latte de noue',lFait:'Latte de faîtage',
  ann:'Pièce d\u2019auvent / varangue',annL:'Latte d\u2019auvent / varangue',luc:'Pièce de lucarne',lucL:'Latte de lucarne',brL:'Latte de contreventement',cein:'Ceinture de sous-face',soli:'Solive de sous-face'};
/* Plan de débit : items = [{L,t}] ; chaque pièce plus longue qu'une barre est raboutée (barres entières + reste).
   Les restes sont rangés du plus long au plus court dans la barre où il reste le moins de place (trait de scie compté). */
function packPlan(items,stock,kerf){
  const bars=[],rest=[];let lin=0;
  items.forEach(it=>{
    lin+=it.L;
    if(it.L<=stock+1e-9){if(it.L>0.02)rest.push({t:it.t,L:it.L,rab:false});return;}
    let L=it.L;
    while(L>stock+1e-9){bars.push({items:[{t:it.t,L:stock,rab:true}],used:stock});L-=stock;}
    if(L>0.02)rest.push({t:it.t,L,rab:true});
  });
  rest.sort((a,b)=>b.L-a.L);
  const bins=[];
  rest.forEach(p=>{
    let best=null;
    bins.forEach(b=>{if(b.free>=p.L-1e-9&&(!best||b.free<best.free))best=b;});
    if(!best){best={free:stock,items:[],used:0};bins.push(best);}
    best.items.push(p);best.used+=p.L;best.free=Math.max(0,best.free-p.L-kerf);
  });
  const list=bars.concat(bins);
  let chute=0;list.forEach(b=>{chute+=Math.max(0,stock-b.used);});
  return{bars:list.length,lin,list,chute,stock};
}
function packBars(items,stock){return packPlan(items.map(L=>({L,t:'x'})),stock,0);}

/* Tôles : feuilles posées côte à côte le long de l'égout, chacune coupée à la longueur de rampant du pan */
function panSheets(poly,e,utile,k){
  const ax=e.d,pu=p=>p.x*ax.x+p.y*ax.y,dp=p=>e.n.x*p.x+e.n.y*p.y-e.c;
  const us=poly.map(pu),u0=Math.min.apply(null,us),u1=Math.max.apply(null,us);
  const depthAt=u=>{
    let best=0;
    for(let i=0;i<poly.length;i++){
      const a=poly[i],b=poly[(i+1)%poly.length],ua=pu(a),ub=pu(b);
      if((ua-u)*(ub-u)>0)continue;
      if(Math.abs(ub-ua)<1e-9){best=Math.max(best,dp(a),dp(b));continue;}
      const t=(u-ua)/(ub-ua);
      best=Math.max(best,dp({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}));
    }
    return best;
  };
  const out=[],n=Math.max(1,Math.ceil((u1-u0)/utile-1e-6));
  for(let i=0;i<n;i++){
    const a=u0+i*utile,b=Math.min(u1,a+utile);
    let m=Math.max(depthAt(a+1e-6),depthAt(b-1e-6));
    poly.forEach(p=>{const u=pu(p);if(u>a&&u<b)m=Math.max(m,dp(p));});
    if(m>0.02)out.push(Math.ceil(m*k*20-1e-9)/20);
  }
  return out;
}

/* ---------- Fermes : tracé d'un bout à l'autre ---------- */
function pointInPoly(p,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))c=!c;
  }
  return c;
}
/* premier croisement avec une arête du squelette ; « hard » = arêtier ou noue (la ferme s'y arrête) */
function rayCast(o,D,arcs){
  let best=Infinity;const hits=[];
  for(const s of arcs){
    const ex=s.b.x-s.a.x,ey=s.b.y-s.a.y,den=D.x*ey-D.y*ex;
    if(Math.abs(den)<1e-9)continue;
    const wx=s.a.x-o.x,wy=s.a.y-o.y;
    const t=(wx*ey-wy*ex)/den,u=(wx*D.y-wy*D.x)/den;
    if(t>1e-6&&u>=-1e-6&&u<=1+1e-6){hits.push({t,kind:s.kind});if(t<best)best=t;}
  }
  if(!hits.length)return{t:Infinity,hard:false};
  return{t:best,hard:hits.some(h=>h.t<best+1e-5&&(h.kind==='hip'||h.kind==='valley'))};
}
function rayBoundary(o,D,poly){
  let best=Infinity;
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const ex=b.x-a.x,ey=b.y-a.y,den=D.x*ey-D.y*ex;
    if(Math.abs(den)<1e-9)continue;
    const wx=a.x-o.x,wy=a.y-o.y;
    const t=(wx*ey-wy*ex)/den,u=(wx*D.y-wy*D.x)/den;
    if(t>1e-5&&u>=-1e-6&&u<=1+1e-6&&t<best)best=t;
  }
  return best;
}
/* Chaque pan a ses fermes, perpendiculaires à son égout, tous les 1,8 m. Une ferme traverse le faîtage
   (ferme complète) mais bute sur l'arêtier ou la noue (demi-ferme) : jamais elle ne passe d'un pan de
   croupe à l'autre. */
function makeChain(e,o0,arcs,Epoly,faces){
  const D=e.n,segs=[];
  let cur={x:o0.x,y:o0.y},s=0,face=e.id,guard=0;
  const push=(f,s0,s1)=>{
    if(s1-s0<1e-4)return;
    const last=segs[segs.length-1];
    if(last&&last.face===f&&Math.abs(last.s1-s0)<1e-6)last.s1=s1;else segs.push({face:f,s0,s1});
  };
  while(guard++<40){
    const h=rayCast(cur,D,arcs),tb=rayBoundary(cur,D,Epoly);
    if(!(h.t<tb-1e-6)){push(face,s,s+tb);return{o:o0,D,segs,sEnd:s+tb,end:'eave'};}
    push(face,s,s+h.t);
    s+=h.t;cur={x:cur.x+D.x*h.t,y:cur.y+D.y*h.t};
    if(h.hard)return{o:o0,D,segs,sEnd:s,end:'stop'};
    const probe={x:cur.x+D.x*1e-3,y:cur.y+D.y*1e-3};
    let nf=-1;
    for(let i=0;i<faces.length;i++)if(faces[i]&&pointInPoly(probe,faces[i])){nf=i;break;}
    if(nf<0)return{o:o0,D,segs,sEnd:s,end:'eave'};
    face=nf;
  }
  return null;
}
/* Niveau de l'entrait : 24 cm sous la ligne de l'arbalétrier au bout du débord (= fiche de 24 cm à chaque bout).
   L'entrait repose sur le haut des murs : le toit est donc relevé d'un talon de 0,54 m (entrait + fiche + axe/couverture). */
const HEEL=0.40,ZENT=-0.24;
function chainGeom(ch,d,fs,slope,edges,seuil,opt){
  opt=opt||{};
  const zT=s=>{
    let sg=ch.segs[ch.segs.length-1];
    for(const q of ch.segs){if(s<=q.s1+1e-9){sg=q;break;}}
    const e=edges[sg.face],x=ch.o.x+ch.D.x*s,y=ch.o.y+ch.D.y*s;
    return slope*(e.n.x*x+e.n.y*y-e.c);
  };
  /* l'entrait ne s'arrête plus sur les murs : il traverse toute la largeur du débord, d'un bout de ferme à l'autre,
     et porte à chaque bout une fiche de 24 cm sur laquelle l'arbalétrier prend appui */
  const sS=0,sE=ch.sEnd;
  if(sE-sS<0.3)return null;
  const nodes=[];
  ch.segs.slice(0,-1).forEach(q=>{if(q.s1>sS+0.05&&q.s1<sE-0.05)nodes.push(q.s1);});
  const near=s=>nodes.some(q=>Math.abs(q-s)<0.45*fs)||Math.abs(sE-s)<0.45*fs;
  for(let j=1;sS+j*fs<sE-1e-6;j++){const s=sS+j*fs;if(!near(s))nodes.push(s);}
  nodes.push(sE);
  nodes.sort((a,b)=>a-b);
  const zE=ZENT;
  const list=[{s:sS,h:Math.max(0,zT(sS)-zE)}].concat(nodes.map(s=>({s,h:Math.max(0,zT(s)-zE)})));
  const posts=list.filter(n=>n.h>0.02);
  const diags=[];
  for(let i=0;i+1<list.length;i++){
    const A=list[i],B=list[i+1],hh=Math.max(A.h,B.h);
    const up=Math.abs(B.h-A.h)<0.01?(i%2===0?'b':'a'):(B.h>A.h?'b':'a');
    if(hh>0.02&&opt.contre)diags.push({s0:A.s,s1:B.s,up,len:Math.hypot(B.s-A.s,hh)});
  }
  /* poinçon trop haut : entraits retroussés, au plus tous les « seuil » mètres */
  const Hmax=Math.max.apply(null,list.map(n=>n.h));
  const ties=[];
  /* sans contrefiches : un entrait retroussé à « retro » % de la hauteur du poinçon ; avec contrefiches : seulement si le poinçon est trop haut */
  const levels=[];
  if(!opt.contre){if(Hmax>=0.6)levels.push(Math.max(0.1,Math.min(0.95,(opt.retro||0.5)))*Hmax);}
  else if(seuil>0&&Hmax>seuil){const n=Math.ceil(Hmax/seuil)-1;for(let j=1;j<=n;j++)levels.push(j*Hmax/(n+1));}
  {
    for(const lv of levels){
      let sa=null,sb=null;
      for(let i=0;i+1<list.length;i++){
        const A=list[i],B=list[i+1];
        if(A.h!==B.h&&(A.h-lv)*(B.h-lv)<=0){
          const t=A.s+(B.s-A.s)*(lv-A.h)/(B.h-A.h);
          if(sa===null)sa=t;
          sb=t;
        }
      }
      if(sa!==null&&ch.end!=='eave'&&sb-sa<0.3)sb=sE;   // demi-ferme : l'autre côté de la retroussée est le montant vertical de bout
      if(sa!==null&&sb-sa>0.3)ties.push({sa,sb,h:lv});
    }
  }
  return{sS,sE,zE,zT,list,posts,diags,ties,Hmax,entLen:sE-sS,d};
}
/* Hauteurs du toit le long d'un segment a->b (mur pignon ou rive rampante) : points de cassure aux arêtes */
function lineProfile(a,b,arcs,faces,edges,slope,inset){
  const L=Math.hypot(b.x-a.x,b.y-a.y);
  if(L<1e-6)return[];
  const dx=(b.x-a.x)/L,dy=(b.y-a.y)/L,ts=[0,L];
  arcs.forEach(q=>{
    if(q.kind==='rake')return;
    const ex=q.b.x-q.a.x,ey=q.b.y-q.a.y,den=dx*ey-dy*ex;
    if(Math.abs(den)<1e-9)return;
    const wx=q.a.x-a.x,wy=q.a.y-a.y;
    const t=(wx*ey-wy*ex)/den,u=(wx*dy-wy*dx)/den;
    if(t>1e-4&&t<L-1e-4&&u>=-1e-6&&u<=1+1e-6)ts.push(t);
  });
  ts.sort((x,y)=>x-y);
  const u=[ts[0]];
  for(let k=1;k<ts.length;k++)if(ts[k]-u[u.length-1]>1e-4)u.push(ts[k]);
  const out=[];
  for(let k=0;k+1<u.length;k++){
    const m=(u[k]+u[k+1])/2;
    const pm={x:a.x+dx*m+inset.x,y:a.y+dy*m+inset.y};
    let f=-1;
    for(let i=0;i<faces.length;i++)if(faces[i]&&pointInPoly(pm,faces[i])){f=i;break;}
    const zAt=t=>{
      if(f<0)return 0;
      const e=edges[f];
      return slope*(e.n.x*(a.x+dx*t)+e.n.y*(a.y+dy*t)-e.c);
    };
    out.push({t:u[k],z:zAt(u[k])},{t:u[k+1],z:zAt(u[k+1])});
  }
  return out;
}

/* Arêtier, noue, faîtière : chacun est une ferme complète (entrait, arbalétrier, fiches) */
function arcTruss(a,d,fs,slope,contre,retro){
  const L=a.plan;
  if(L<0.25)return null;
  const dir={x:(a.b.x-a.a.x)/L,y:(a.b.y-a.a.y)/L};
  const out={dir};
  if(a.kind==='ridge'){
    const h=slope*a.ta-ZENT;
    if(h<0.15)return null;
    const xs=[0];
    for(let j=1;j*fs<L-0.45*fs;j++)xs.push(j*fs);
    xs.push(L);
    out.P=a.a;out.Le=L;out.zE=ZENT;out.top=()=>slope*a.ta;
    out.nodes=xs.map(x=>({x,h}));
    out.diags=[];
    for(let i=0;i+1<xs.length;i++)out.diags.push({x0:xs[i],x1:xs[i+1],up:i%2===0?'b':'a',len:Math.hypot(xs[i+1]-xs[i],h)});
    out.arbLen=L;out.entLen=L;out.ties=[];
    if(!contre)out.diags=[];
  }else{
    /* arêtier / noue : l'entrait part du bout du débord (fiche de 24 cm), comme les fermes courantes */
    const ts=a.ta;
    if(a.tb-ts<0.05)return null;
    const Le=L;
    const top=x=>slope*(ts+(a.tb-ts)*x/Le),h=x=>top(x)-ZENT;
    const xs=[0];
    for(let j=1;j*fs<Le-0.45*fs;j++)xs.push(j*fs);
    xs.push(Le);
    out.P=a.a;out.Le=Le;out.zE=ZENT;out.top=top;
    out.nodes=xs.map(x=>({x,h:h(x)}));
    out.diags=[];
    for(let i=0;i+1<xs.length;i++)out.diags.push({x0:xs[i],x1:xs[i+1],up:'b',len:Math.hypot(xs[i+1]-xs[i],h(xs[i+1]))});
    out.arbLen=a.real;out.entLen=Le;out.ties=[];
    const h0=h(0),hmax=h(Le);
    if(!contre&&hmax>=0.6){
      const lv=Math.max(0.1,Math.min(0.95,retro==null?0.5:retro))*hmax;
      if(lv>h0+0.05)out.ties.push({sa:Le*(lv-h0)/(hmax-h0),sb:Le,h:lv});
    }
    if(!contre)out.diags=[];
  }
  return out;
}

/* ---------- Calcul complet de la charpente ---------- */
const COUV_UTILE=o=>(o.utile>0?o.utile:0);
function buildPlan(wallsRaw,o,flags){
  const cl=cleanPolyF(wallsRaw,flags);
  const Wp=cl.poly;let gf=cl.flags;
  if(Wp.length<3)return{err:'Contour trop petit.'};
  if(area(Wp)<0){
    const n0=Wp.length;
    Wp.reverse();
    gf=Wp.map((_,j)=>gf[(((n0-2-j)%n0)+n0)%n0]);
  }
  if(gf.every(g=>g))return{err:'Au moins un côté doit rester en pente.'};
  const wts=gf.map(g=>g?0:1);
  if(selfIntersects(Wp))return{err:'Le contour se croise : déplace un point pour le corriger.'};
  const d=Math.max(0,o.debord);
  const E=offsetOut(Wp,d);
  if(!E)return{err:'Débord trop grand pour cette forme : réduis-le dans les réglages.'};
  const sk=skeleton(E,true,wts);
  if(!sk)return{err:'Calcul impossible pour ce contour.'};
  const faces=buildFaces(sk.poly,sk.arcs,wts);
  if(!faces)return{err:gf.some(g=>g)?'Cette combinaison de pignons ne peut pas être calculée : change un côté.':'Géométrie de toiture non résolue pour ce contour.'};

  const slope=o.pente/100,k=Math.sqrt(1+slope*slope);
  const fe=Math.max(0.5,o.fermes),fs=Math.max(0.2,o.fiches);
  const edges=sk.edges,arcs=sk.arcs.filter(a=>a.kind!=='flat'),nE=edges.length;
  arcs.forEach(a=>{
    const L=Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y),dh=(a.tb-a.ta)*slope;
    a.plan=L;a.real=Math.sqrt(L*L+dh*dh);
  });
  let maxT=0;arcs.forEach(a=>{maxT=Math.max(maxT,a.ta,a.tb);});

  /* --- fermes courantes : une ligne tous les 1,8 m depuis une extrémité du bâtiment --- */
  /* une seule grille d'entraxe « fe » par direction, partagée par tous les égouts parallèles : les fermes de deux murs
     face à face (les deux bras d'un U, par exemple) tombent sur les MÊMES lignes et se confondent en fermes complètes
     au lieu de s'intercaler à mi-entraxe. Un égout trop court pour recevoir une ligne de la grille reçoit une ferme
     de garantie (voir plus bas). */
  const axes=[];
  edges.forEach((e,i)=>{
    let ang=Math.atan2(e.d.y,e.d.x)*180/Math.PI;
    if(ang<0)ang+=180;
    if(ang>=179.7)ang=0;
    const axv={x:Math.cos(ang*Math.PI/180),y:Math.sin(ang*Math.PI/180)};
    const perp=-axv.y*e.a.x+axv.x*e.a.y;
    let g=axes.find(x=>Math.abs(x.ang-ang)<0.3);
    if(!g){g={ang,perp,ax:axv,ids:[],tmin:1e9,tmax:-1e9};axes.push(g);}
    if(!gf[i])g.ids.push(i);
    [Wp[i],Wp[(i+1)%nE]].forEach(p=>{const t=g.ax.x*p.x+g.ax.y*p.y;g.tmin=Math.min(g.tmin,t);g.tmax=Math.max(g.tmax,t);});
  });
  const use=axes.filter(g=>g.ids.length);
  const chains=[];
  const same=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<0.03;
  const ptSeg=(P,A,B)=>{
    const dx=B.x-A.x,dy=B.y-A.y,l2=dx*dx+dy*dy||1;
    let t=((P.x-A.x)*dx+(P.y-A.y)*dy)/l2;t=Math.max(0,Math.min(1,t));
    return Math.hypot(A.x+dx*t-P.x,A.y+dy*t-P.y);
  };
  /* y a-t-il déjà une ferme parallèle à D, à moins de minD de ce point, qui couvre le même endroit ? */
  const nearPar=(P,D,minD)=>chains.some(c=>{
    const cl=Math.hypot(c.end2.x-c.o.x,c.end2.y-c.o.y)||1,ux=(c.end2.x-c.o.x)/cl,uy=(c.end2.y-c.o.y)/cl;
    if(Math.abs(ux*D.y-uy*D.x)>1e-3)return false;
    const dist=Math.abs((P.x-c.o.x)*(-uy)+(P.y-c.o.y)*ux),al=(P.x-c.o.x)*ux+(P.y-c.o.y)*uy;
    return dist<minD&&al>-0.3&&al<cl+0.3;
  });
  use.forEach(g=>{
    const tl=[],ins=0.10;                       // les fermes d'extrémité restent à l'intérieur du mur pignon
    const t0=g.tmin+ins,t1=g.tmax-ins;
    for(let j=0;t0+j*fe<=t1+1e-9;j++)tl.push(t0+j*fe);
    /* dernière ligne : la ferme d'extrémité n'est indispensable que contre un mur pignon ; ailleurs on évite un dernier entraxe trop serré */
    const gEnd=t=>edges.some((e,i)=>gf[i]&&Math.abs(e.d.x*g.ax.x+e.d.y*g.ax.y)<0.02&&Math.abs((g.ax.x*Wp[i].x+g.ax.y*Wp[i].y)-t)<0.06);
    const rem=t1-tl[tl.length-1];
    if(gEnd(g.tmax)){if(rem>=0.5*fe)tl.push(t1);else if(rem>0.02)tl[tl.length-1]=t1;}
    else if(rem>=0.6*fe)tl.push(t1);
    for(const i of g.ids){
      const e=edges[i];
      const ta=g.ax.x*e.a.x+g.ax.y*e.a.y,ad=g.ax.x*e.d.x+g.ax.y*e.d.y;
      let inRange=0;
      for(const t of tl){
        const s=(t-ta)/ad;
        if(s<0.05||s>e.len-0.05)continue;
        inRange++;
        const o0={x:e.a.x+e.d.x*s,y:e.a.y+e.d.y*s};
        const ch=makeChain(e,o0,arcs,sk.poly,faces);
        if(!ch)continue;
        const endP={x:o0.x+e.n.x*ch.sEnd,y:o0.y+e.n.y*ch.sEnd};
        if(chains.some(c=>(same(c.o,o0)&&same(c.end2,endP))||(same(c.o,endP)&&same(c.end2,o0))))continue;
        const gm=chainGeom(ch,d,fs,slope,edges,o.seuil,{contre:!!o.contre,retro:(o.retro==null?50:o.retro)/100});
        if(!gm)continue;
        ch.g=gm;ch.end2=endP;
        chains.push(ch);
      }
      if(inRange===0&&e.len>0.8){                              // égout trop court pour la grille : une ferme au milieu
        const o0={x:e.a.x+e.d.x*(e.len/2),y:e.a.y+e.d.y*(e.len/2)};
        if(!nearPar(o0,e.n,0.6*fe)){
          const ch=makeChain(e,o0,arcs,sk.poly,faces);
          if(ch){
            const endP={x:o0.x+e.n.x*ch.sEnd,y:o0.y+e.n.y*ch.sEnd};
            const gm=chainGeom(ch,d,fs,slope,edges,o.seuil,{contre:!!o.contre,retro:(o.retro==null?50:o.retro)/100});
            if(gm){ch.g=gm;ch.end2=endP;chains.push(ch);}
          }
        }
      }
    }
    /* fermes qui ne partent d'aucun égout : la ligne de la grille traverse un pan hors de son égout (près d'une noue ou
       d'un arêtier). Elle part alors de l'arêtier (ou du poinçon du faîtage) et vient buter sur la noue. */
    for(const i of g.ids){
      const e=edges[i],poly=faces[i];
      if(!poly)continue;
      const ta=g.ax.x*e.a.x+g.ax.y*e.a.y,ad=g.ax.x*e.d.x+g.ax.y*e.d.y,D=e.n;
      /* la grille se prolonge de part et d'autre tant qu'elle traverse encore ce pan (un pan peut s'élargir bien au-delà de son égout) */
      let pMin=1e9,pMax=-1e9;poly.forEach(P=>{const v=g.ax.x*P.x+g.ax.y*P.y;pMin=Math.min(pMin,v);pMax=Math.max(pMax,v);});
      const tlx=tl.slice();
      for(let t=tl[0]-fe;t>=pMin+0.1;t-=fe)tlx.push(t);
      for(let t=tl[tl.length-1]+fe;t<=pMax-0.1;t+=fe)tlx.push(t);
      for(const t of tlx){
        const sOn=(t-ta)/ad;
        if(sOn>=0.05&&sOn<=e.len-0.05)continue;                 // cette ligne part déjà de l'égout
        const Q0={x:g.ax.x*t,y:g.ax.y*t};
        const hits=[];
        for(let k=0;k<poly.length;k++){
          const A=poly[k],B=poly[(k+1)%poly.length],ex=B.x-A.x,ey=B.y-A.y,den=D.x*ey-D.y*ex;
          if(Math.abs(den)<1e-9)continue;
          const wx=A.x-Q0.x,wy=A.y-Q0.y,sP=(wx*ey-wy*ex)/den,u=(D.y*wx-D.x*wy)/den;
          if(u>=-1e-9&&u<=1+1e-9)hits.push(sP);
        }
        hits.sort((a,b)=>a-b);
        const sv=[];hits.forEach(h=>{if(!sv.length||h-sv[sv.length-1]>1e-5)sv.push(h);});
        for(let k=0;k+1<sv.length;k+=2){
          const sa=sv[k],sb=sv[k+1];
          if(sb-sa<0.5)continue;
          const E0={x:Q0.x+D.x*sa,y:Q0.y+D.y*sa};
          if(ptSeg(E0,e.a,e.b)<0.06)continue;                     // l'entrée est sur l'égout du pan : déjà traité
          const M0={x:Q0.x+D.x*(sa+sb)/2,y:Q0.y+D.y*(sa+sb)/2};
          if(chains.some(c=>ptSeg(M0,c.o,c.end2)<0.12))continue;   // déjà couvert par une autre ferme
          /* jamais deux fermes parallèles à moins de 0,8 × l'entraxe l'une de l'autre */
          if(nearPar(M0,D,0.8*fe))continue;
          const o0={x:Q0.x+D.x*(sa+0.02),y:Q0.y+D.y*(sa+0.02)};
          const ch=makeChain(e,o0,arcs,sk.poly,faces);
          if(!ch||ch.sEnd<0.5)continue;
          ch.float=true;
          const endP={x:o0.x+D.x*ch.sEnd,y:o0.y+D.y*ch.sEnd};
          if(chains.some(c=>(same(c.o,o0)&&same(c.end2,endP))||(same(c.o,endP)&&same(c.end2,o0))))continue;
          const gm=chainGeom(ch,d,fs,slope,edges,o.seuil,{contre:!!o.contre,retro:(o.retro==null?50:o.retro)/100});
          if(!gm)continue;
          ch.g=gm;ch.end2=endP;
          chains.push(ch);
        }
      }
    }
  });
  /* aucun bois ne doit dépasser d'un mur pignon : on coupe tout ce qui sort, avec un retrait à l'intérieur du mur */
  const nW=Wp.length,gstr=[];
  gf.forEach((g,i)=>{
    if(!g)return;
    const a=Wp[i],b=Wp[(i+1)%nW],L=Math.hypot(b.x-a.x,b.y-a.y),e=edges[i];
    const pv=Wp[(i+nW-1)%nW],nx=Wp[(i+2)%nW];
    const cvS=((a.x-pv.x)*(b.y-a.y)-(a.y-pv.y)*(b.x-a.x))>1e-9,cvE=((b.x-a.x)*(nx.y-b.y)-(b.y-a.y)*(nx.x-b.x))>1e-9;
    gstr.push({a,dir:e.d,n:e.n,L,cW:e.n.x*a.x+e.n.y*a.y,u0:-(cvS?d+0.1:0.02),u1:L+(cvE?d+0.1:0.02)});
  });
  const cutStrip=(p0,q0,inset)=>{
    let a=p0,b=q0;
    for(const g of gstr){
      const fn=P=>g.n.x*P.x+g.n.y*P.y-g.cW,un=P=>(P.x-g.a.x)*g.dir.x+(P.y-g.a.y)*g.dir.y;
      let lo=0,hi=1,ok=true;
      const lin=(v0,v1,mn,mx)=>{
        const dv=v1-v0;
        if(Math.abs(dv)<1e-12){if(v0<mn||v0>mx)ok=false;return;}
        let t0=(mn-v0)/dv,t1=(mx-v0)/dv;if(t0>t1){const x=t0;t0=t1;t1=x;}
        lo=Math.max(lo,t0);hi=Math.min(hi,t1);
      };
      lin(un(a),un(b),g.u0,g.u1);lin(fn(a),fn(b),-(d+0.4),inset);
      if(!ok||hi-lo<1e-9)continue;
      const A0=a,B0=b,mk=t=>({x:A0.x+(B0.x-A0.x)*t,y:A0.y+(B0.y-A0.y)*t});
      if(lo<=1e-9&&hi>=1-1e-9)return null;
      if(lo<=1e-9)a=mk(hi);else if(hi>=1-1e-9)b=mk(lo);
    }
    return Math.hypot(b.x-a.x,b.y-a.y)>0.05?[a,b]:null;
  };
  /* arêtes raccourcies pour la structure (le faîtage s'arrête dans le mur pignon, la couverture le dépasse) */
  const warcs=[];
  arcs.forEach(a=>{
    if(a.kind==='rake')return;
    const cs=cutStrip(a.a,a.b,0.12);
    if(!cs)return;
    const Lp=Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y)||1,ux=(a.b.x-a.a.x)/Lp,uy=(a.b.y-a.a.y)/Lp;
    const f0=((cs[0].x-a.a.x)*ux+(cs[0].y-a.a.y)*uy)/Lp,f1=((cs[1].x-a.a.x)*ux+(cs[1].y-a.a.y)*uy)/Lp;
    const plan=Math.hypot(cs[1].x-cs[0].x,cs[1].y-cs[0].y);
    warcs.push(Object.assign({},a,{a:cs[0],b:cs[1],ta:a.ta+(a.tb-a.ta)*f0,tb:a.ta+(a.tb-a.ta)*f1,plan,real:a.real*plan/Lp}));
  });
  const specials=[];
  warcs.forEach(a=>{const g=arcTruss(a,d,fs,slope,!!o.contre,(o.retro==null?50:o.retro)/100);if(g)specials.push({arc:a,g});});

  const M={arb:[],ent:[],fiche:[],retro:[],tAret:[],tNoue:[],tFait:[],pannage:[],sab:[],lAret:[],lNoue:[],lFait:[],ann:[],annL:[],luc:[],lucL:[],brL:[],cein:[],soli:[]};
  chains.forEach(ch=>{
    ch.segs.forEach(sg=>M.arb.push(Math.hypot(sg.s1-sg.s0,ch.g.zT(sg.s1)-ch.g.zT(sg.s0))));
    M.ent.push(ch.g.entLen);
    ch.g.posts.forEach(p=>M.fiche.push(p.h));
    ch.g.diags.forEach(q=>M.fiche.push(q.len));
    ch.g.ties.forEach(t=>M.retro.push(t.sb-t.sa));
  });
  const cnt={ridge:0,hip:0,valley:0};
  specials.forEach(sp=>{
    const a=sp.arc,g=sp.g;
    const L=a.kind==='hip'?M.tAret:a.kind==='valley'?M.tNoue:M.tFait;
    cnt[a.kind]++;
    L.push(g.arbLen,g.entLen);
    g.nodes.forEach(n=>L.push(n.h));
    g.diags.forEach(q=>L.push(q.len));
    g.ties.forEach(t=>M.retro.push(t.sb-t.sa));
  });

  /* --- pannage en lattes sur chaque pan, jusqu'aux arêtes --- */
  const pannage=[],sab=[];
  const gl=Math.max(0.15,o.lattes)/k;
  faces.forEach((poly,i)=>{
    if(!poly)return;
    const e=edges[i];
    let maxD=0;
    poly.forEach(p=>{maxD=Math.max(maxD,e.n.x*p.x+e.n.y*p.y-e.c);});
    for(let j=0;j*gl<maxD-0.02;j++){
      clipRow(poly,e,Math.max(j*gl,0.05)).forEach(sg0=>{      // la panne sablière est à 5 cm du bout : elle ne dépasse pas sous la planche
        const sg=sg0;                       // les pannes traversent le pignon et butent sur la planche de rive
        const L=Math.hypot(sg[1].x-sg[0].x,sg[1].y-sg[0].y);
        if(L>0.05){pannage.push({face:i,a:sg[0],b:sg[1]});M.pannage.push(L);}
      });
    }
  });
  Wp.forEach((a,i)=>{
    if(gf[i])return;
    const b0=Wp[(i+1)%Wp.length],L0=Math.hypot(b0.x-a.x,b0.y-a.y)||1,ux=(b0.x-a.x)/L0,uy=(b0.y-a.y)/L0;
    const cA=gf[(i+Wp.length-1)%Wp.length]?0.06:0,cB=gf[(i+1)%Wp.length]?0.06:0;
    const a2={x:a.x+ux*cA,y:a.y+uy*cA},b2={x:b0.x-ux*cB,y:b0.y-uy*cB};
    sab.push({face:i,a:a2,b:b2});M.sab.push(L0-cA-cB);
  });
  arcs.forEach(a=>{
    if(a.kind==='rake')return;
    if(a.kind==='ridge'){for(let j=0;j<o.ligFait;j++)M.lFait.push(a.real);}
    else if(a.kind==='hip'){for(let j=0;j<o.ligAret;j++)M.lAret.push(a.real);}
    else{for(let j=0;j<o.ligNoue;j++)M.lNoue.push(a.real);}
  });

  /* --- auvents et varangues : toit en appentis appuyé contre un mur --- */
  const anns=[],annSheets=[],warns=[];
  let annArea=0;
  (o.anns||[]).forEach((A0,ai)=>{
    const i=Math.round(A0.side)-1;
    if(!(i>=0&&i<nE)){warns.push('Annexe '+(ai+1)+' : ce côté n\u2019existe pas.');return;}
    const a=Wp[i],b=Wp[(i+1)%nE],L=Math.hypot(b.x-a.x,b.y-a.y);
    if(L<0.5)return;
    const dd={x:(b.x-a.x)/L,y:(b.y-a.y)/L},nn=edges[i].n,out={x:-nn.x,y:-nn.y};
    const isVar=A0.type==='varangue';
    const len=Math.min(L,A0.len>0?A0.len:(isVar?L:2));
    const uc=(A0.pos==null?50:A0.pos)/100*L;
    const u0=Math.max(0,Math.min(L-len,uc-len/2)),u1=u0+len;
    const P=Math.max(0.5,A0.depth||(isVar?2.5:1)),sl=Math.max(0.02,(A0.pente||(isVar?20:15))/100);
    const hp=(o.hMur||2.8)-(A0.sous==null?0.5:A0.sous);
    const oo=0.3,ov=0.2,ka=Math.sqrt(1+sl*sl),Ls=(P+oo)*ka;
    const us=[];
    for(let u=u0;u<=u1+1e-9;u+=fe)us.push(u);
    if(Math.abs(us[us.length-1]-u1)>1e-6){if(u1-us[us.length-1]>0.3*fe)us.push(u1);else us[us.length-1]=u1;}
    const hb=Math.max(0.5,0.6*P),tj=0.85*P;
    us.forEach(()=>{
      M.ann.push(Ls);                                           // arbalétrier
      if(isVar){M.ann.push(P);if(sl*P>0.05)M.ann.push(sl*P);}    // entrait + montant côté mur
      else M.ann.push(Math.hypot(tj,hb-sl*tj));                  // jambe de force
    });
    M.ann.push(len);                                            // lisse contre le mur
    let posts=[];
    const hpost=hp-sl*P-0.14;
    if(isVar){
      M.ann.push(len);                                          // poutre sur poteaux
      const np=Math.max(2,Math.ceil(len/2.5)+1);
      for(let j=0;j<np;j++)posts.push(u0+j*len/(np-1));
      posts.forEach(()=>M.ann.push(Math.max(0.3,hpost)));
    }
    const gl2=Math.max(0.15,o.lattes||0.6);
    for(let t=0.05;t<=Ls+1e-9;t+=gl2)M.annL.push(len+2*ov);
    const lowH=hp-sl*(P+oo);
    if(lowH<1.9)warns.push((isVar?'Varangue ':'Auvent ')+(ai+1)+' : égout à '+fmt(lowH)+' m, un peu bas (réduis la pente ou la profondeur, ou remonte la pose).');
    annArea+=(len+2*ov)*Ls;
    if(COUV_UTILE(o)>0){
      const n=Math.max(1,Math.ceil((len+2*ov)/COUV_UTILE(o)-1e-6)),Lt=Math.ceil(Ls*20-1e-9)/20;
      annSheets.push({label:(isVar?'Varangue':'Auvent')+' '+(ai+1)+' (côté '+(i+1)+')',lens:new Array(n).fill(Lt),area:(len+2*ov)*Ls});
    }
    anns.push({i,type:isVar?'varangue':'auvent',a,dd,out,u0,u1,P,sl,hp,oo,ov,len,us,posts,hb,tj,hpost,Ls,ka,lowH});
  });

  /* --- lucarnes : petit volume à deux pentes qui sort d'un pan --- */
  const lucs=[];
  let lucArea=0,lucCap=0,lucRake=0,lucEave=0,lucLisse=0;
  (o.lucs||[]).forEach((L0,li)=>{
    const f=Math.round(L0.side)-1;
    if(!(f>=0&&f<nE)||!faces[f]){warns.push('Lucarne '+(li+1)+' : ce côté n\u2019a pas de pan incliné (pignon ou inexistant).');return;}
    const e=edges[f],poly=faces[f];
    const pu=p=>p.x*e.d.x+p.y*e.d.y;
    const us2=poly.map(pu),ua=Math.min.apply(null,us2),ub=Math.max.apply(null,us2);
    const uc=ua+Math.max(0,Math.min(100,L0.pos==null?50:L0.pos))/100*(ub-ua);
    const W=Math.max(0.5,L0.w||1.2),half=W/2,h=Math.max(0.3,L0.h||0.8),D0=Math.max(0.3,L0.dist||1.2);
    const sd=slope,ov=0.2,of=0.25;
    const z0=slope*D0,ze=z0+h,zr=ze+half*sd;
    const De=ze/slope,Dr=zr/slope,Df=Math.max(0.05,D0-of),Dbk=(zr-sd*(half+ov))/slope;
    const u0a=pu(e.a);
    const pp=(u,D)=>({x:e.a.x+e.d.x*(u-u0a)+e.n.x*D,y:e.a.y+e.d.y*(u-u0a)+e.n.y*D});
    const chk=[pp(uc-half,D0),pp(uc+half,D0),pp(uc-half,De),pp(uc+half,De),pp(uc,Dr)];
    if(!chk.every(q=>pointInPoly(q,poly))){warns.push('Lucarne '+(li+1)+' : elle ne tient pas dans le pan (trop haute, trop large ou trop loin de l\u2019égout). Réduis la hauteur ou rapproche-la de l\u2019égout.');return;}
    const sq=Math.sqrt(1+sd*sd),ra=(half+ov)*sq;
    const ds=[];
    for(let D=D0+0.12;D<=De+1e-6;D+=fe)ds.push(D);
    if(Math.abs(ds[ds.length-1]-De)>1e-6){if(De-ds[ds.length-1]>0.3*fe)ds.push(De);else ds[ds.length-1]=De;}
    ds.forEach(()=>{M.luc.push(ra,ra,W+2*ov,zr-ze);});
    M.luc.push(W);
    const sl2=(De-D0)*k;M.luc.push(sl2,sl2);
    M.luc.push(h,h);
    const gl2=Math.max(0.15,o.lattes||0.6);
    for(let sp=0.05;sp<=ra+1e-9;sp+=gl2){
      const x=sp/sq,Dback=Math.max(D0+0.16,(zr-sd*x)/slope);
      M.lucL.push(Dback-(D0+0.06),Dback-(D0+0.06));
    }
    for(let j=0;j<(o.ligFait||2);j++)M.lucL.push(Dr-(D0+0.06));
    const vl=Math.sqrt(half*half+(Dr-De)*(Dr-De)+(zr-ze)*(zr-ze));
    for(let j=0;j<(o.ligNoue||2);j++)M.lucL.push(vl,vl);
    const pArea=ra*((Dr-Df)+(Dbk-Df))/2;
    lucArea+=2*pArea;lucCap+=Dr-Df;
    lucRake+=2*(half+ov)*sq;lucEave+=2*(Dbk-Df);
    lucLisse+=2*(half+ov)*sq*of+2*ov*(Dbk-Df);
    if(COUV_UTILE(o)>0){
      const n=Math.max(1,Math.ceil((Dr-Df)/COUV_UTILE(o)-1e-6)),Lt=Math.ceil(ra*20-1e-9)/20;
      annSheets.push({label:'Lucarne '+(li+1)+', versant gauche',lens:new Array(n).fill(Lt),area:pArea});
      annSheets.push({label:'Lucarne '+(li+1)+', versant droit',lens:new Array(n).fill(Lt),area:pArea});
    }
    lucs.push({f,e,uc,half,W,h,D0,De,Dr,Df,Dbk,z0,ze,zr,sd,ov,ra,ds,u0a});
  });
  annArea+=lucArea;

  /* --- contreventement : liernes et croix de Saint-André entre fermes voisines (au niveau des poinçons) --- */
  const braces=[];
  if(o.lierne!==false||(o.croixN||0)>0){
    const info=chains.map(c=>{
      let pk=null;c.g.posts.forEach(p=>{if(!pk||p.h>pk.h)pk=p;});
      if(!pk||pk.h<0.5)return null;
      const A=c.D;
      const px=c.o.x+c.D.x*pk.s,py=c.o.y+c.D.y*pk.s;
      return{pk,px,py,zE:c.g.zE,key:Math.round(Math.atan2(A.y,A.x)*100),t:-px*A.y+py*A.x,u:px*A.x+py*A.y};
    }).filter(Boolean);
    const groups={};
    info.forEach(q=>{(groups[q.key]=groups[q.key]||[]).push(q);});
    const doRun=run=>{
      const nb=run.length;
      run.forEach((bay,bi)=>{
        const a=bay[0],b=bay[1],horiz=Math.hypot(b.px-a.px,b.py-a.py);
        const pa={x:a.px,y:a.py},pb={x:b.px,y:b.py};
        if(o.lierne!==false){
          const z=a.zE+Math.min(a.pk.h,b.pk.h)/2;
          M.brL.push(horiz);braces.push({k:'lierne',a:pa,b:pb,za:z,zb:z});
        }
        const N=o.croixN||0;
        if(N>0&&(bi===0||bi===nb-1||bi%N===0)){
          const l1=Math.hypot(horiz,b.pk.h),l2=Math.hypot(horiz,a.pk.h);
          M.brL.push(l1,l2);
          braces.push({k:'croix',a:pa,b:pb,za:a.zE,zb:a.zE+b.pk.h},{k:'croix',a:pb,b:pa,za:a.zE,zb:a.zE+a.pk.h});
        }
      });
    };
    Object.keys(groups).forEach(kk=>{
      const gr=groups[kk].sort((a,b)=>a.t-b.t);
      let run=[];
      for(let i=0;i+1<gr.length;i++){
        const a=gr[i],b=gr[i+1];
        const ok=(b.t-a.t)>0.3&&(b.t-a.t)<=fe*1.2&&Math.abs(a.u-b.u)<2.0&&Math.abs(a.pk.h-b.pk.h)<0.9;
        if(ok)run.push([a,b]);else{if(run.length)doRun(run);run=[];}
      }
      if(run.length)doRun(run);
    });
  }

  /* --- solivage de sous-face : ceinture au pied du mur fini + solives tous les 0,98 m jusqu'à la planche de rive --- */
  if(o.solivage!==false){
    const sp=Math.max(0.3,o.solEsp||0.98);
    for(let i=0;i<nW;i++){
      const a=Wp[i],b=Wp[(i+1)%nW],L=Math.hypot(b.x-a.x,b.y-a.y);
      let lc=L;
      if(gf[i]){
        const pr=lineProfile(a,b,arcs,faces,edges,slope,{x:0,y:0});
        lc=0;for(let k=0;k+1<pr.length;k+=2)lc+=Math.hypot(pr[k+1].t-pr[k].t,pr[k+1].z-pr[k].z);
        if(!lc)lc=L;
      }
      M.cein.push(lc);
      const nj=Math.max(1,Math.ceil(L/sp-1e-9));
      for(let j=1;j<nj;j++)M.soli.push(d);
      const p0=Wp[(i+nW-1)%nW];
      if((a.x-p0.x)*(b.y-a.y)-(a.y-p0.y)*(b.x-a.x)>1e-9)M.soli.push(d*Math.SQRT2);   // solive d'angle (sommet convexe)
    }
  }

  /* --- nomenclature --- */
  const PL=o.piece||5;
  const cat={};
  Object.keys(M).forEach(key2=>{cat[key2]={n:M[key2].length,lin:M[key2].reduce((s,x)=>s+x,0)};});
  const BK=['arb','ent','fiche','retro','tAret','tNoue','tFait','ann','luc'],LK=['pannage','sab','lAret','lNoue','lFait','annL','lucL','brL','cein','soli'];
  const itemsOf=keys=>[].concat.apply([],keys.map(kk=>M[kk].map(L=>({L,t:kk}))));
  const kerf=Math.max(0,o.kerf||0);
  const bast=packPlan(itemsOf(BK),PL,kerf);
  const latt=packPlan(itemsOf(LK),PL,kerf);
  /* quantités de tôles par pan */
  const sheets=[];
  if((COUV_UTILE(o))>0){
    faces.forEach((poly,i)=>{
      if(!poly)return;
      const lens=panSheets(poly,edges[i],COUV_UTILE(o),k);
      sheets.push({label:'Pan du côté '+(i+1),lens,area:Math.abs(area(poly))*k});
    });
    annSheets.forEach(x=>sheets.push(x));
  }
  let rive=0;
  sk.poly.forEach((p,i)=>{if(gf[i])return;const q=sk.poly[(i+1)%nE];rive+=Math.hypot(q.x-p.x,q.y-p.y);});
  let capLen=0;
  arcs.forEach(a=>{if(a.kind==='ridge'||a.kind==='hip')capLen+=a.real;});
  capLen+=lucCap;
  let capRidge=0,capHip=0,valley=0;
  arcs.forEach(a=>{if(a.kind==='ridge')capRidge+=a.real;else if(a.kind==='hip')capHip+=a.real;else if(a.kind==='valley')valley+=a.real;});
  lucs.forEach(q=>{capRidge+=q.Dr-q.Df;valley+=2*Math.sqrt(q.half*q.half+(q.Dr-q.De)*(q.Dr-q.De)+(q.zr-q.ze)*(q.zr-q.ze));});
  const jn=[];
  arcs.forEach(a=>{
    if(a.kind!=='ridge'&&a.kind!=='hip')return;
    [a.a,a.b].forEach(pt=>{
      let nd=null;for(const q of jn)if(Math.hypot(q.x-pt.x,q.y-pt.y)<1e-4){nd=q;break;}
      if(!nd){nd={x:pt.x,y:pt.y,n:0};jn.push(nd);}
      nd.n++;
    });
  });
  const capJunc=jn.filter(q=>q.n>=3).length;                 // jonctions arêtiers / faîtage : faîtières d'angle
  let gutCorners=0;for(let i=0;i<nE;i++)if(!gf[i]&&!gf[(i+1)%nE])gutCorners++;
  let solin=0,annGut=0;anns.forEach(an=>{solin+=an.len+2*an.ov;annGut+=an.len+2*an.ov;});
  let perim=0;                                  // périmètre sous le débord : égouts à plat, pignons suivant la pente des rampants
  for(let i=0;i<nE;i++){
    const a=Wp[i],b=Wp[(i+1)%nE],Lw=Math.hypot(b.x-a.x,b.y-a.y);
    if(gf[i]){
      const pr=lineProfile(a,b,arcs,faces,edges,slope,{x:0,y:0});
      let lc=0;for(let k=0;k+1<pr.length;k+=2)lc+=Math.hypot(pr[k+1].t-pr[k].t,pr[k+1].z-pr[k].z);
      perim+=lc||Lw;
    }else perim+=Lw;
  }
  /* pignons : mur triangulaire au-dessus des murs, et rive rampante le long du bord du toit */
  const gables=[],rakes=[];
  let gableArea=0,rakeLen=0;
  const zw=slope*d;
  gf.forEach((g,i)=>{
    if(!g)return;
    const a=Wp[i],b=Wp[(i+1)%nE];
    const prof=lineProfile(a,b,arcs,faces,edges,slope,{x:0,y:0});
    gables.push({edge:i,a,b,prof});
    for(let k=0;k+1<prof.length;k+=2){
      const p0=prof[k],p1=prof[k+1];
      gableArea+=Math.max(0,(p1.t-p0.t)*((p0.z+p1.z)/2+HEEL));
    }
    const e=edges[i];
    const rp=lineProfile(e.a,e.b,arcs,faces,edges,slope,{x:e.n.x*1e-3,y:e.n.y*1e-3});
    rakes.push({edge:i,a:e.a,b:e.b,prof:rp});
    for(let k=0;k+1<rp.length;k+=2)rakeLen+=Math.hypot(rp[k+1].t-rp[k].t,rp[k+1].z-rp[k].z);
  });
  const planArea=Math.abs(area(E));
  return{
    W:Wp,E:sk.poly,d,slope,anns,lucs,braces,warns,edges,arcs,warcs,faces,chains,specials,pannage,sab,gf,gables,rakes,
    stats:{
      cat,bast,latt,sheets,nTot:chains.length,nFull:chains.filter(c=>c.end==='eave').length,cnt,rive,capLen,capRidge,capHip,valley,capJunc,gutCorners,solin,annGut,perim,lucRake,lucEave,lucLisse,nGable:gables.length,gableArea,rakeLen,
      wallArea:Math.abs(area(Wp)),roofPlan:planArea,realArea:planArea*k+annArea,
      hMax:Math.max(0,maxT*slope+HEEL),angle:Math.atan(slope)*180/Math.PI
    }
  };
}

const hexRGB=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];};

function genTexture(type,hex,S){
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),im=g.createImageData(S,S),D=im.data,rgb=hexRGB(hex);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let y=0;y<S;y++){
    const v=y/S;
    for(let x=0;x<S;x++){
      const u=x/S;let sh=1;
      if(type==='bac'){
        const q=(u*4)%1;
        sh=q<0.12?0.74+q/0.12*0.18:q<0.22?0.92+(q-0.12)/0.1*0.12:q<0.62?1.04:q<0.72?1.04-(q-0.62)/0.1*0.12:q<0.88?0.92-(q-0.72)/0.16*0.18:0.74;
        sh*=0.97+0.05*rnd();
      }else if(type==='ondulee'){
        sh=0.9+0.14*Math.cos(2*Math.PI*8*u)+0.02*(rnd()-0.5);
      }else if(type==='tuiles'){
        const row=Math.floor(v*4),ry=(v*4)%1,xx=(u*4+(row%2)*0.5)%1;
        sh=1.1-0.5*ry*ry;
        if(ry>0.93)sh=0.5;
        if(xx<0.03||xx>0.97)sh*=0.65;
        sh*=0.93+0.1*Math.sin(Math.PI*xx)+0.03*rnd();
      }else{
        const row=Math.floor(v*4),ry=(v*4)%1,xx=(u*4+(row%2)*0.5)%1;
        sh=1.05-0.3*ry;
        if(ry>0.94)sh=0.55;
        sh*=0.92+0.08*Math.cos(2*Math.PI*xx*2);
        if(xx<0.02||xx>0.98)sh*=0.7;
        sh*=0.84+0.3*rnd();
      }
      const p=(y*S+x)*4;
      D[p]=Math.min(255,rgb[0]*sh);D[p+1]=Math.min(255,rgb[1]*sh);D[p+2]=Math.min(255,rgb[2]*sh);D[p+3]=255;
    }
  }
  g.putImageData(im,0,0);
  return c;
}

function genWallTexture(type,S){
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),im=g.createImageData(S,S),D=im.data,rgb=hexRGB(WALLS[type].hex);
  let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const hash=(a,b)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);};
  const stoneRows=[[0,.3,.62,1],[0,.45,.8,1],[0,.2,.55,1],[0,.38,.7,1],[0,.28,.6,1]];
  let mort=[205,200,190];
  if(type==='laterite')mort=[120,78,58];
  if(type==='parpeint')mort=[190,176,146];
  if(type==='pierre')mort=[170,164,150];
  for(let y=0;y<S;y++){
    const v=y/S;
    for(let x=0;x<S;x++){
      const u=x/S;let sh=1,m=0;
      if(type==='enduit'||type==='blanc'){
        sh=0.96+0.07*rnd()+0.025*Math.sin(u*37)*Math.sin(v*23);
      }else if(type==='crepi'){
        sh=0.84+0.3*hash(Math.floor(x/2),Math.floor(y/2))+0.04*rnd();
      }else if(type==='brique'||type==='laterite'){
        const rows=type==='brique'?12:8,cols=type==='brique'?4:3;
        const row=Math.floor(v*rows),ry=(v*rows)%1,cx=u*cols+(row%2)*0.5,col=Math.floor(cx),xx=cx-col;
        const cc=((col%cols)+cols)%cols;
        m=(ry<(type==='brique'?0.1:0.07)||xx<(type==='brique'?0.045:0.03))?1:0;
        sh=(type==='brique'?0.78:0.72)+0.4*hash(row,cc)+0.08*(rnd()-0.5);
        if(type==='laterite')sh+=0.12*Math.sin(u*90+row)*Math.sin(v*70);
      }else if(type==='parpaing'||type==='parpeint'){
        const row=Math.floor(v*4),ry=(v*4)%1,cx=u*2+(row%2)*0.5,col=Math.floor(cx),xx=cx-col;
        const cc=((col%2)+2)%2;
        m=(ry<0.05||xx<0.025)?1:0;
        sh=(type==='parpaing'?0.9:0.96)+0.1*hash(row,cc)+0.07*(rnd()-0.5);
      }else if(type==='pierre'){
        const row=Math.floor(v*5),ry=(v*5)%1,br=stoneRows[row];
        let k=0;while(k<3&&u>=br[k+1])k++;
        const xx=(u-br[k])/(br[k+1]-br[k]);
        m=(ry<0.06||xx<0.035||xx>0.965)?1:0;
        sh=0.78+0.4*hash(row,k)+0.12*(rnd()-0.5);
      }else{
        sh=0.94+0.1*rnd();
        if((v*2)%1<0.012)sh*=0.75;
        if(Math.abs((u*3)%1-0.5)<0.012&&(v*2)%1>0.4&&(v*2)%1<0.6)sh*=0.7;
      }
      const p=(y*S+x)*4;
      if(m){const k2=0.92+0.12*rnd();D[p]=mort[0]*k2;D[p+1]=mort[1]*k2;D[p+2]=mort[2]*k2;}
      else{D[p]=Math.min(255,rgb[0]*sh);D[p+1]=Math.min(255,rgb[1]*sh);D[p+2]=Math.min(255,rgb[2]*sh);}
      D[p+3]=255;
    }
  }
  g.putImageData(im,0,0);
  return c;
}

/* ---------- Maillage 3D (sans dépendance) ---------- */
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm3=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};

function pushTri(m,A,B,C,col,uv){
  const n=nrm3(cross3(sub3(B,A),sub3(C,A)));
  [A,B,C].forEach((p,i)=>{
    const t=uv?uv[i]:[0,0];
    m.push(p[0],p[1],p[2],n[0],n[1],n[2],t[0],t[1],col[0],col[1],col[2]);
  });
}
function pushQuad(m,A,B,C,D,col){pushTri(m,A,B,C,col);pushTri(m,A,C,D,col);}
function pushBox(m,P0,P1,side,dep,col){
  const a=nrm3(sub3(P1,P0));
  const hint=Math.abs(a[2])>0.99?[1,0,0]:[0,0,1];
  const lat=nrm3(cross3(hint,a)),dp=nrm3(cross3(a,lat));
  const s=side/2,t=dep/2;
  const c=(P,sl,sd)=>[P[0]+lat[0]*s*sl+dp[0]*t*sd,P[1]+lat[1]*s*sl+dp[1]*t*sd,P[2]+lat[2]*s*sl+dp[2]*t*sd];
  const c0=c(P0,-1,-1),c1=c(P0,1,-1),c2=c(P0,1,1),c3=c(P0,-1,1);
  const e0=c(P1,-1,-1),e1=c(P1,1,-1),e2=c(P1,1,1),e3=c(P1,-1,1);
  pushQuad(m,c0,c1,e1,e0,col);pushQuad(m,c1,c2,e2,e1,col);
  pushQuad(m,c2,c3,e3,e2,col);pushQuad(m,c3,c0,e0,e3,col);
  pushQuad(m,c0,c3,c2,c1,col);pushQuad(m,e0,e1,e2,e3,col);
}

function build3D(r,o){
  const slope=o.pente/100,k=Math.sqrt(1+slope*slope),d=r.d;
  const Hw=o.hMur,zw=slope*d,offz=Hw+HEEL;
  const TH=1.6,SA=-0.10;                           // épaisseurs exagérées ; axe des fermes à 10 cm sous la couverture (demi-pièce + latte)
  const env=[],st=[],cv=[],cp=[],rv=[],rm=[],wl=[];
  const Wd=(x,y,z)=>[x,-y,z+offz];                 // plan -> monde (y inversé : le nord reste en haut)
  const edges=r.edges;
  const zOn=(i,p)=>slope*(edges[i].n.x*p.x+edges[i].n.y*p.y-edges[i].c);
  const beam=(m,p,q,zp,zq,side,dep,col)=>pushBox(m,Wd(p.x,p.y,zp),Wd(q.x,q.y,zq),side,dep,col);
  const faceAt=p=>{for(let i=0;i<r.faces.length;i++)if(r.faces[i]&&pointInPoly(p,r.faces[i]))return i;return -1;};

  /* sol & murs */
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  r.E.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,-p.y);y1=Math.max(y1,-p.y);});
  const mg=Math.max(x1-x0,y1-y0)*0.6+4;
  pushQuad(env,[x0-mg,y0-mg,-0.03],[x1+mg,y0-mg,-0.03],[x1+mg,y1+mg,-0.03],[x0-mg,y1+mg,-0.03],rgbf('#4d6f55'));
  /* murs texturés ; les côtés « pignon » montent en triangle jusque sous le toit */
  const wtw=o.wallTW||1,wth=o.wallTH||1,wh=[1,1,1];
  let cum=0;
  r.W.forEach((a,i)=>{
    const b=r.W[(i+1)%r.W.length],L=Math.hypot(b.x-a.x,b.y-a.y);
    const u0=cum/wtw,u1=(cum+L)/wtw;
    if(!r.gf[i]){
      const A=[a.x,-a.y,0],B=[b.x,-b.y,0],C=[b.x,-b.y,Hw],D=[a.x,-a.y,Hw];
      pushTri(wl,A,B,C,wh,[[u0,0],[u1,0],[u1,Hw/wth]]);
      pushTri(wl,A,C,D,wh,[[u0,0],[u1,Hw/wth],[u0,Hw/wth]]);
    }else{
      const dx=(b.x-a.x)/L,dy=(b.y-a.y)/L;
      const gb=r.gables.find(q=>q.edge===i),pr=gb?gb.prof:[];
      const poly2=[{x:0,y:0},{x:L,y:0}];
      for(let k=pr.length-1;k>=0;k--)poly2.push({x:pr[k].t,y:pr[k].z+offz-0.03});
      triangulate(poly2).forEach(t=>{
        const P=t.map(q=>[a.x+dx*q.x,-(a.y+dy*q.x),q.y]);
        const uv=t.map(q=>[(cum+q.x)/wtw,q.y/wth]);

  });

  /* décorations (pignons et lucarnes) : cadre et fond sombre dessinés dans le plan du mur */
  const drawDeco=(type,D,P)=>{
    const frame=o.decoCol,glass=rgbf('#27323c');
      const Q=(x0,y0,x1,y1,off,c)=>pushQuad(env,P(x0,y0,off),P(x1,y0,off),P(x1,y1,off),P(x0,y1,off),c);
      const T3=(a,b,c2,off,c)=>pushTri(env,P(a[0],a[1],off),P(b[0],b[1],off),P(c2[0],c2[1],off),c);
      const disc=(cx,cy,r0,off,c,a0,a1,n)=>{
        a0=a0||0;a1=(a1===undefined)?Math.PI*2:a1;n=n||32;
        for(let k=0;k<n;k++){
          const t0=a0+(a1-a0)*k/n,t1=a0+(a1-a0)*(k+1)/n;
          T3([cx,cy],[cx+r0*Math.cos(t0),cy+r0*Math.sin(t0)],[cx+r0*Math.cos(t1),cy+r0*Math.sin(t1)],off,c);
        }
      };
      const ring=(cx,cy,r0,r1,off,c)=>{
        const n=32;
        for(let k=0;k<n;k++){
          const t0=Math.PI*2*k/n,t1=Math.PI*2*(k+1)/n;
          pushQuad(env,P(cx+r1*Math.cos(t0),cy+r1*Math.sin(t0),off),P(cx+r1*Math.cos(t1),cy+r1*Math.sin(t1),off),
                       P(cx+r0*Math.cos(t1),cy+r0*Math.sin(t1),off),P(cx+r0*Math.cos(t0),cy+r0*Math.sin(t0),off),c);
        }
      };
      const R=D/2;
      if(type==='oeil'){
        ring(0,0,R*0.8,R,0.028,frame);disc(0,0,R*0.8,0.014,glass);
        Q(-R*0.8,-0.012,R*0.8,0.012,0.022,frame);Q(-0.012,-R*0.8,0.012,R*0.8,0.022,frame);
      }else if(type==='rosace'){
        disc(0,0,R,0.012,glass);ring(0,0,R*0.9,R,0.028,frame);ring(0,0,R*0.42,R*0.5,0.026,frame);disc(0,0,R*0.14,0.03,frame);
        for(let k=0;k<8;k++){

                       P(c*R*0.9+s2*w,s2*R*0.9-c*w,0.026),P(c*R*0.5+s2*w,s2*R*0.5-c*w,0.026),frame);

  /* fermes courantes : arbalétriers, entrait, fiches, entraits retroussés */

    g.posts.forEach(p=>{

  /* fermes d'arêtier, de noue et de faîtière : fermes complètes dans le plan de l'arête */
  r.specials.forEach(sp=>{

      beam(st,at(xx),at(xx),zE,g.top(n.x)+SA,0.04*TH,0.12,WOOD.fiche);

  /* lattes : pannage, sablière, puis lignes au-dessus des fermes d'arêtier, de noue, de faîtière */
  const LW=0.08,LT=0.04;
  const lowL=LT/2+LW/2*slope+0.02;                    // la latte est horizontale : son arête haute côté faîte ne doit pas percer la tôle
  r.pannage.forEach(s=>beam(st,s.a,s.b,zOn(s.face,s.a)-lowL,zOn(s.face,s.b)-lowL,LW,LT,WOOD.latte));
  r.sab.forEach(s=>beam(st,s.a,s.b,zOn(s.face,s.a)-lowL-0.02,zOn(s.face,s.b)-lowL-0.02,LW,LT,WOOD.latte));
  r.arcs.forEach(a=>{
    if(a.kind==='rake')return;
    const dx=a.b.x-a.a.x,dy=a.b.y-a.a.y,l=Math.hypot(dx,dy)||1,px=-dy/l,py=dx/l;
    const n=a.kind==='ridge'?o.ligFait:a.kind==='hip'?o.ligAret:o.ligNoue;

    /* une latte d'arêtier / de noue qui part du bout du débord est reculée : ses coins ne dépassent plus sous la planche */
    const f0=(a.kind!=='ridge'&&a.ta<0.05)?Math.min(0.14,l*0.3)/l:0;

  /* rive : planche de rive + bande de rive (même largeur) + gouttière, angles à onglet.

  const nE=r.E.length;
  const sweep=(m,prof,col,closedProf)=>{

    const at=(q,i,atEnd)=>{

  const ribbon=(m,line,out,off0,off1,col,zb2)=>{

  r.rakes.forEach(rk=>{

  (r.lucs||[]).forEach(L=>{

    const soffCol2=rgbf('#d4d8dc'),zbL=zt-hRluc-0.004;

      const C0=pl(sg*L.half,L.D0),C1=pl(xa,L.D0),C2=pl(xa,L.Dbk),C3=pl(sg*L.half,L.De);

  /* sous-face (tôle lisse) : plan PLAT au niveau des murs sous les égouts (les entraits traversent le débord au-dessus),
     plan INCLINÉ sous les rives rampantes des pignons, et un relais vertical à chaque angle où le plat rejoint l'incliné.
     Ceinture contre le mur et solives tous les 0,98 m jusqu'à la planche de rive, bases alignées. */
  if(o.solivage!==false){

    const zF=-HEEL-0.004;                         // dessous de la tôle plate : au bas des entraits et des solives (bases alignées)
    const profZ=(pr,t)=>{let z=0;for(let k=0;k+1<pr.length;k+=2){const p0=pr[k],p1=pr[k+1];if(p1.t>p0.t&&t>=p0.t-1e-9&&t<=p1.t+1e-9)z=p0.z+(p1.z-p0.z)*(t-p0.t)/(p1.t-p0.t);}return z;};
    const slopeAt=(pr,end)=>{const k=end?pr.length-2:0,p0=pr[k],p1=pr[k+1];return p1.t>p0.t?(p1.z-p0.z)/(p1.t-p0.t):0;};
    const dd=r.d;
    for(let i=0;i<nE;i++){
      const a=r.W[i],b=r.W[(i+1)%nE],Ea=r.E[i],Eb=r.E[(i+1)%nE],e=edges[i],L=Math.hypot(b.x-a.x,b.y-a.y);
      if(L<1e-3)continue;
      const gb=r.gf[i]?r.gables.find(q=>q.edge===i):null;
      const Wp_=f=>({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f}),Ep_=f=>({x:Ea.x+(Eb.x-Ea.x)*f,y:Ea.y+(Eb.y-Ea.y)*f});
      const nj=Math.max(1,Math.ceil(L/sp-1e-9));
      const nin=(w,off)=>({x:w.x-e.n.x*off,y:w.y-e.n.y*off});       // vers l'extérieur de off
      if(!gb){
        const w0=Wp_(0),w1=Wp_(1),e0=Ep_(0),e1=Ep_(1),zc=-HEEL+LT/2;
        beam(st,nin(w0,0.04),nin(w1,0.04),zc,zc,LW,LT,WOOD.latte);                                              // ceinture
        for(let j=1;j<nj;j++){const t=j*L/nj,w=Wp_(t/L);beam(st,nin(w,0.02),nin(w,dd-tB-0.01),zc,zc,LW,LT,WOOD.latte);}   // solives
        pushQuad(rm,Wd(w0.x,w0.y,zF),Wd(w1.x,w1.y,zF),Wd(e1.x,e1.y,zF),Wd(e0.x,e0.y,zF),soffCol);              // tôle lisse plate
        if(zbP>zF+0.005)pushQuad(rm,Wd(e0.x,e0.y,zF),Wd(e1.x,e1.y,zF),Wd(e1.x,e1.y,zbP),Wd(e0.x,e0.y,zbP),soffCol);   // retour jusqu'à la planche
      }else{
        const pr=gb.prof,ts=[0];
        pr.forEach(q=>{if(q.t>1e-6&&q.t<L-1e-6)ts.push(q.t);});ts.push(L);
        const uts=[...new Set(ts.map(x=>+x.toFixed(4)))].sort((x,y)=>x-y);
        const zI=t=>profZ(pr,t)+zbP,slS=slopeAt(pr,0),slE=slopeAt(pr,1),out={x:-e.n.x,y:-e.n.y};
        for(let k=0;k+1<uts.length;k++){
          const t0=uts[k],t1=uts[k+1],w0=Wp_(t0/L),w1=Wp_(t1/L),z0=zI(t0),z1=zI(t1);
          let e0={x:w0.x+out.x*dd,y:w0.y+out.y*dd},e1={x:w1.x+out.x*dd,y:w1.y+out.y*dd},ze0=z0,ze1=z1;
          if(k===0){e0=Ea;ze0=z0-slS*dd;}                           // le coin E est reculé de d sur la pente
          if(k===uts.length-2){e1=Eb;ze1=z1+slE*dd;}
          pushQuad(rm,Wd(w0.x,w0.y,z0-0.004),Wd(w1.x,w1.y,z1-0.004),Wd(e1.x,e1.y,ze1-0.004),Wd(e0.x,e0.y,ze0-0.004),soffCol);   // tôle lisse inclinée
          beam(st,nin(w0,0.04),nin(w1,0.04),z0+LT/2,z1+LT/2,LW,LT,WOOD.latte);                                    // ceinture inclinée
        }
        for(let j=1;j<nj;j++){const t=j*L/nj,w=Wp_(t/L),z=zI(t)+LT/2;beam(st,nin(w,0.02),nin(w,dd-tB-0.01),z,z,LW,LT,WOOD.latte);}   // solives
        /* relais vertical : du plan plat de l'égout voisin au plan incliné, le long de la diagonale d'angle */
        const prevG=r.gf[(i+nE-1)%nE],nextG=r.gf[(i+1)%nE];
        if(!prevG){
          const z0=zI(0);
          pushQuad(rm,Wd(a.x,a.y,zF),Wd(Ea.x,Ea.y,zF),Wd(Ea.x,Ea.y,z0-slS*dd-0.004),Wd(a.x,a.y,z0-0.004),soffCol);
        }
        if(!nextG){
          const z1=zI(L);
          pushQuad(rm,Wd(b.x,b.y,zF),Wd(Eb.x,Eb.y,zF),Wd(Eb.x,Eb.y,z1+slE*dd-0.004),Wd(b.x,b.y,z1-0.004),soffCol);
        }
      }
    }
  }

  /* couverture : un polygone par pan, UV dans le plan du pan */
  const ts=o.tile||1,white=[1,1,1];
  r.faces.forEach((poly,i)=>{
    if(!poly)return;
    const e=edges[i];
    triangulate(poly).forEach(t=>{
      const P=t.map(p=>Wd(p.x,p.y,zOn(i,p)));
      const uv=t.map(p=>[(e.d.x*p.x+e.d.y*p.y)/ts,((e.n.x*p.x+e.n.y*p.y-e.c)*k)/ts]);
      pushTri(cv,P[0],P[1],P[2],white,uv);
    });
  });

  /* auvents et varangues : couverture, fermes, lattes, poteaux */
  (r.anns||[]).forEach(an=>{
    const P3=(u,t,zabs)=>Wd(an.a.x+an.dd.x*u+an.out.x*t,an.a.y+an.dd.y*u+an.out.y*t,zabs-offz);
    const zAt=t=>an.hp-an.sl*t,uA=an.u0-an.ov,uB=an.u1+an.ov,tO=an.P+an.oo;
    const uvf=(u,t)=>[u/ts,(t*an.ka)/ts];
    const c0=P3(uA,0,zAt(0)+0.02),c1=P3(uB,0,zAt(0)+0.02),c2=P3(uB,tO,zAt(tO)+0.02),c3=P3(uA,tO,zAt(tO)+0.02);
    pushTri(cv,c0,c1,c2,white,[uvf(uA,0),uvf(uB,0),uvf(uB,tO)]);
    pushTri(cv,c0,c2,c3,white,[uvf(uA,0),uvf(uB,tO),uvf(uA,tO)]);
    const sd=0.04*TH,dp=0.12*TH,zl=zAt(an.P)-0.12;
    an.us.forEach(u=>{
      pushBox(st,P3(u,0,zAt(0)-0.12),P3(u,tO,zAt(tO)-0.12),sd,dp,WOOD.arb);
      if(an.type==='varangue'){
        pushBox(st,P3(u,0,zl),P3(u,an.P,zl),sd,dp,WOOD.ent);
        if(an.sl*an.P>0.05)pushBox(st,P3(u,0.02,zl),P3(u,0.02,zAt(0)-0.12),sd,dp,WOOD.fiche);
      }else{
        pushBox(st,P3(u,0.02,an.hp-an.hb),P3(u,an.tj,zAt(an.tj)-0.12),sd,dp,WOOD.fiche);
      }
    });
    pushBox(st,P3(an.u0,0.04,an.hp-0.16),P3(an.u1,0.04,an.hp-0.16),sd,dp,WOOD.ent);
    if(an.type==='varangue'){
      pushBox(st,P3(an.u0,an.P,zl-0.1),P3(an.u1,an.P,zl-0.1),sd*1.5,dp,WOOD.ent);
      an.posts.forEach(u=>pushBox(env,P3(u,an.P,0),P3(u,an.P,zl-0.16),0.14,0.14,WOOD.arb));
    }
    const gl2=Math.max(0.15,o.lattesEsp||0.6);
    for(let t=0.05;t<=an.Ls+1e-9;t+=gl2){
      const tp=t/an.ka;
      pushBox(st,P3(uA,tp,zAt(tp)-0.01),P3(uB,tp,zAt(tp)-0.01),0.05,0.035,WOOD.latte);
    }
  });

  /* lucarnes : façade et joues en maçonnerie, deux versants, fermes, lattes */
  (r.lucs||[]).forEach(L=>{
    const e=L.e;
    const P3=(x,D,zr_)=>{
      const u=L.uc+x,q={x:e.a.x+e.d.x*(u-L.u0a)+e.n.x*D,y:e.a.y+e.d.y*(u-L.u0a)+e.n.y*D};
      return Wd(q.x,q.y,zr_);
    };
    const tw=o.wallTW||1,th=o.wallTH||1,wh=[1,1,1];
    const uvW=(x,zrel)=>[x/tw,(zrel+offz)/th];
    // façade (pentagone)
    const F=[[-L.half,L.z0],[L.half,L.z0],[L.half,L.ze],[0,L.zr],[-L.half,L.ze]];
    for(let k=1;k<=3;k++){
      const A=F[0],B=F[k],C=F[k+1];
      pushTri(wl,P3(A[0],L.D0,A[1]),P3(B[0],L.D0,B[1]),P3(C[0],L.D0,C[1]),wh,[uvW(A[0],A[1]),uvW(B[0],B[1]),uvW(C[0],C[1])]);
    }
    // joues triangulaires
    [-1,1].forEach(sg=>{
      const x=sg*L.half,A=P3(x,L.D0,L.z0),B=P3(x,L.D0,L.ze),C=P3(x,L.De,L.ze);
      pushTri(wl,A,B,C,wh,[[L.D0/tw,(L.z0+offz)/th],[L.D0/tw,(L.ze+offz)/th],[L.De/tw,(L.ze+offz)/th]]);
    });
    // versants
    const sq=Math.sqrt(1+L.sd*L.sd);
    [-1,1].forEach(sg=>{
      const xe=sg*(L.half+L.ov),ze2=L.zr-L.sd*(L.half+L.ov);
      const F0=P3(xe,L.Df,ze2+0.02),B0=P3(xe,L.Dbk,ze2+0.02),B1=P3(0,L.Dr,L.zr+0.02),F1=P3(0,L.Df,L.zr+0.02);
      const uv=(D,x)=>[D/ts,(Math.abs(x)*sq)/ts];
      pushTri(cv,F0,B0,B1,white,[uv(L.Df,xe),uv(L.Dbk,xe),uv(L.Dr,0)]);
      pushTri(cv,F0,B1,F1,white,[uv(L.Df,xe),uv(L.Dr,0),uv(L.Df,0)]);
      // tôle faîtière du faîtage de la lucarne
      const cw2=o.capW/2,zc=L.zr-L.sd*cw2+0.034;
      pushQuad(cp,P3(0,L.Df,L.zr+0.034),P3(0,L.Dr,L.zr+0.034),P3(sg*cw2,L.Dr,zc),P3(sg*cw2,L.Df,zc),o.capCol);
    });
    // décoration au centre de la façade
    if(o.deco&&o.deco!=='aucune'){
      const outW=[-e.n.x,e.n.y],D=Math.min(0.6*L.h,0.6*L.W)*((o.decoSize||100)/100);
      if(D>0.2){
        const base=Wd(e.a.x+e.d.x*(L.uc-L.u0a)+e.n.x*L.D0,e.a.y+e.d.y*(L.uc-L.u0a)+e.n.y*L.D0,0);
        const cz=L.z0+L.h*0.45+offz;
        const P=(x,y,off)=>[base[0]+e.d.x*x+outW[0]*off,base[1]-e.d.y*x+outW[1]*off,cz+y];
        drawDeco(o.deco,D,P);
      }
    }
    // structure
    const sd2=0.04*TH,dp2=0.12*TH;
    L.ds.forEach(D=>{
      pushBox(st,P3(-L.half,D,L.ze-0.1),P3(L.half,D,L.ze-0.1),sd2,dp2,WOOD.ent);
      [-1,1].forEach(sg=>pushBox(st,P3(sg*(L.half+L.ov),D,L.zr-L.sd*(L.half+L.ov)-0.12),P3(0,D,L.zr-0.12),sd2,dp2,WOOD.arb));
      pushBox(st,P3(0,D,L.ze-0.1),P3(0,D,L.zr-0.12),sd2,dp2,WOOD.fiche);
    });
    pushBox(st,P3(-L.half,L.D0+0.12,L.z0+0.08),P3(L.half,L.D0+0.12,L.z0+0.08),sd2,dp2,WOOD.ent);
    [-1,1].forEach(sg=>{
      pushBox(st,P3(sg*(L.half-0.1),L.D0+0.12,L.z0+0.1),P3(sg*(L.half-0.1),L.D0+0.12,L.ze-0.1),sd2,dp2,WOOD.fiche);
      pushBox(st,P3(sg*(L.half-0.1),L.D0+0.12,L.z0+0.08),P3(sg*(L.half-0.1),L.De,L.ze+0.0-0.04),sd2,dp2,WOOD.ent);
    });
    const gl2=Math.max(0.15,o.lattesEsp||0.6);
    for(let sp=0.05;sp<=L.ra+1e-9;sp+=gl2){
      const x=sp/sq,Dback=Math.max(L.D0+0.16,(L.zr-L.sd*x)/(L.ze/L.De)),zl=L.zr-L.sd*x-(0.02+0.04*L.sd+0.012);
      [-1,1].forEach(sg=>pushBox(st,P3(sg*x,L.D0+0.06,zl),P3(sg*x,Dback,zl),0.08,0.04,WOOD.latte));
    }
    /* deux lattes de noue de chaque côté, et lattes de faîtage */
    const pl=(x,D)=>({x:e.a.x+e.d.x*(L.uc+x-L.u0a)+e.n.x*D,y:e.a.y+e.d.y*(L.uc+x-L.u0a)+e.n.y*D});
    [-1,1].forEach(sg=>{
      const A=pl(sg*(L.half+L.ov),L.Dbk),B=pl(0,L.Dr),vx=B.x-A.x,vy=B.y-A.y,vl=Math.hypot(vx,vy)||1,px=-vy/vl,py=vx/vl,n=o.ligNoue||2;
      for(let j=0;j<n;j++){
        const sh=(j-(n-1)/2)*0.07;
        beam(st,{x:A.x+px*sh,y:A.y+py*sh},{x:B.x+px*sh,y:B.y+py*sh},L.zr-L.sd*(L.half+L.ov)-0.03,L.zr-0.03,0.08,0.04,WOOD.noue);
      }
    });
    {
      const n=o.ligFait||2,zf=L.zr-(0.02+0.04*L.sd+0.012);
      for(let j=0;j<n;j++){const sh=(j-(n-1)/2)*0.07;beam(st,pl(sh,L.D0+0.06),pl(sh,L.Dr),zf,zf,0.08,0.04,WOOD.fait);}
    }
  });

  /* contreventement : liernes et croix de Saint-André */
  (r.braces||[]).forEach(b=>{
    pushBox(st,Wd(b.a.x,b.a.y,b.za+SA),Wd(b.b.x,b.b.y,b.zb+SA),0.05,0.035,WOOD.pan);   // dans le plan des fiches, sous la couverture
  });

  /* tôles faîtières sur chaque arêtier et chaque faîtage, jonctions comblées */
  const cw=o.capW/2,lift=0.014;
  const capArcs=r.arcs.filter(a=>(a.kind==='ridge'||a.kind==='hip')&&Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y)>=0.05);
  capArcs.forEach(a=>{
    const dx=a.b.x-a.a.x,dy=a.b.y-a.a.y,l=Math.hypot(dx,dy);
    const px=-dy/l,py=dx/l;
    const mid={x:(a.a.x+a.b.x)/2,y:(a.a.y+a.b.y)/2};
    [1,-1].forEach(sg=>{
      const f=faceAt({x:mid.x+px*sg*0.05,y:mid.y+py*sg*0.05});
      if(f<0)return;
      const qa={x:a.a.x+px*sg*cw,y:a.a.y+py*sg*cw},qb={x:a.b.x+px*sg*cw,y:a.b.y+py*sg*cw};
      const A=Wd(a.a.x,a.a.y,a.ta*slope+lift),B=Wd(a.b.x,a.b.y,a.tb*slope+lift);
      const QA=Wd(qa.x,qa.y,zOn(f,qa)+lift),QB=Wd(qb.x,qb.y,zOn(f,qb)+lift);
      pushQuad(cp,A,B,QB,QA,o.capCol);
    });
  });
  const cnodes=[];
  const nid=p=>{
    for(const nd of cnodes)if(Math.hypot(nd.x-p.x,nd.y-p.y)<1e-4)return nd;
    const nd={x:p.x,y:p.y,arcs:[]};cnodes.push(nd);return nd;
  };
  capArcs.forEach(a=>{nid(a.a).arcs.push({a,t:a.ta});nid(a.b).arcs.push({a,t:a.tb});});
  cnodes.forEach(nd=>{
    if(nd.arcs.length<2)return;
    const pts=[];
    nd.arcs.forEach((q,qi)=>{
      const a=q.a,l=Math.hypot(a.b.x-a.a.x,a.b.y-a.a.y);
      const px=-(a.b.y-a.a.y)/l,py=(a.b.x-a.a.x)/l;
      [1,-1].forEach(sg=>{
        const x=nd.x+px*sg*cw,y=nd.y+py*sg*cw;
        pts.push({x,y,arc:qi,ang:Math.atan2(y-nd.y,x-nd.x)});
      });
    });
    pts.sort((u,v)=>u.ang-v.ang);
    const zc=nd.arcs[0].t*slope+lift;
    for(let k=0;k<pts.length;k++){
      const A=pts[k],B=pts[(k+1)%pts.length];
      if(A.arc===B.arc)continue;
      let gap=B.ang-A.ang;if(gap<=0)gap+=Math.PI*2;
      if(gap>Math.PI*0.97||gap<1e-3)continue;
      const f=faceAt({x:((A.x+B.x)/2+nd.x)/2,y:((A.y+B.y)/2+nd.y)/2});
      if(f<0)continue;
      pushTri(cp,Wd(nd.x,nd.y,zc),Wd(A.x,A.y,zOn(f,A)+lift),Wd(B.x,B.y,zOn(f,B)+lift),o.capCol);
    }
  });

  return{
    env,st,cv,cp,rv,rm,wl,
    target:[(x0+x1)/2,(y0+y1)/2,Hw+r.stats.hMax*0.35],
    size:Math.max(x1-x0,y1-y0)
  };
}

/* ---------- Matrices (colonne majeure) ---------- */
function mOrtho(h,asp,n,f){return[1/(h*asp),0,0,0,0,1/h,0,0,0,0,-2/(f-n),0,0,0,-(f+n)/(f-n),1];}
function mPersp(fov,asp,n,f){const t=1/Math.tan(fov/2);return[t/asp,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0];}
function mLook(e,c,u){
  let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2],l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  return[xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1];
}
function mMul(a,b){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
