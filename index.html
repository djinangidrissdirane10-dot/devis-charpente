function padBottom(){return sheet.classList.contains('hidden')?0:Math.min(sheet.offsetHeight,H*0.7);}
function fit(){
  const H2=H-padBottom();
  if(!pts.length){view.s=40;view.ox=W/2;view.oy=H2/2;return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const src=res?res.E:pts;
  src.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  const bw=Math.max(x1-x0,1),bh=Math.max(y1-y0,1);
  view.s=Math.max(3,Math.min((W-70)/bw,(H2-70)/bh,200));
  view.ox=W/2-(x0+bw/2)*view.s;
  view.oy=H2/2-(y0+bh/2)*view.s;
}

/* ---------- Accrochage ---------- */
function gridStep(){const s=view.s;return s>=100?0.05:s>=20?0.1:s>=8?0.5:1;}
function snap(wp,idx,prevIdx){
  const g=gridStep();
  const p={x:Math.round(wp.x/g)*g,y:Math.round(wp.y/g)*g};
  pts.forEach((o,i)=>{
    if(i===idx)return;
    if(Math.abs(wp.x-o.x)*view.s<10)p.x=o.x;
    if(Math.abs(wp.y-o.y)*view.s<10)p.y=o.y;
  });
  const prev=prevIdx>=0?pts[prevIdx]:null;
  if(prev){
    const dx=wp.x-prev.x,dy=wp.y-prev.y,L=Math.hypot(dx,dy);
    if(L>1e-6){
      const ang=Math.atan2(dy,dx)*180/Math.PI;
      const near=Math.round(ang/45)*45;
      const tol=(Math.abs(near)%90===0)?10:5;
      if(Math.abs(ang-near)<tol){
        const horiz=Math.abs(near)%180===0,vert=Math.abs(near)%180===90;
        if(horiz)p.y=prev.y;
        else if(vert)p.x=prev.x;
        else{
          const r=near*Math.PI/180,L2=Math.max(g,Math.round(L/g)*g);
          p.x=prev.x+Math.cos(r)*L2;p.y=prev.y+Math.sin(r)*L2;
        }
      }
    }
  }
  return p;
}

/* ---------- Dessin 2D ---------- */
const COL={ridge:'#ff6b4a',hip:'#ffc857',valley:'#5ad1e6'};
function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function polyPath(poly){ctx.beginPath();poly.forEach((p,i)=>{const q=toS(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});}
function label(txt,x,y,color,size){
  ctx.font=(size||12)+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=4;ctx.strokeStyle='#14304a';ctx.strokeText(txt,x,y);
  ctx.fillStyle=color||'#f2efe6';ctx.fillText(txt,x,y);
}

function drawGrid(){
  const s=view.s;
  if(s<6)return;
  const w0=toW(0,0),w1=toW(W,H);
  ctx.lineWidth=1;
  for(let x=Math.floor(w0.x);x<=Math.ceil(w1.x);x++){
    ctx.strokeStyle=x%5===0?'#2d5a7d':'#1f4666';
    const sx=view.ox+x*s;line({x:sx,y:0},{x:sx,y:H});
  }
  for(let y=Math.floor(w0.y);y<=Math.ceil(w1.y);y++){
    ctx.strokeStyle=y%5===0?'#2d5a7d':'#1f4666';
    const sy=view.oy+y*s;line({x:0,y:sy},{x:W,y:sy});
  }
}

function draw(){
  if(mode3d)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';
  drawGrid();

  const poly=res?res.W:pts;
  if(res){
    polyPath(res.E);ctx.closePath();ctx.fillStyle='rgba(242,239,230,0.05)';ctx.fill();
    if(opts.showPannes){
      ctx.strokeStyle='#b7e07a';ctx.lineWidth=1.4;
      res.pannage.forEach(s=>line(toS(s.a),toS(s.b)));
    }
    if(opts.showFermes){
      ctx.strokeStyle='#d9a066';ctx.lineWidth=2.6;
      res.chains.forEach(ch=>line(toS(ch.o),toS(ch.end2)));
    }
    res.arcs.forEach(a=>{if(a.kind==='rake')return;ctx.strokeStyle=COL[a.kind];ctx.lineWidth=3.2;line(toS(a.a),toS(a.b));});
    (res.lucs||[]).forEach((L,li)=>{
      const Pp=(x,D)=>{const u=L.uc+x;return toS({x:L.e.a.x+L.e.d.x*(u-L.u0a)+L.e.n.x*D,y:L.e.a.y+L.e.d.y*(u-L.u0a)+L.e.n.y*D});};
      const hw=L.half+L.ov;
      ctx.strokeStyle='#ff9bd0';ctx.lineWidth=2;
      const q=[Pp(-hw,L.Df),Pp(hw,L.Df),Pp(hw,L.Dbk),Pp(0,L.Dr),Pp(-hw,L.Dbk)];
      ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);q.slice(1).forEach(z=>ctx.lineTo(z.x,z.y));ctx.closePath();ctx.stroke();
      line(Pp(0,L.Df),Pp(0,L.Dr));
      ctx.strokeStyle='#5ad1e6';line(Pp(-L.half,L.De),Pp(0,L.Dr));line(Pp(L.half,L.De),Pp(0,L.Dr));
      const m=Pp(0,(L.Df+L.De)/2);label('L'+(li+1),m.x,m.y,'#ff9bd0',12);
    });
    if(opts.showFermes)(res.braces||[]).forEach(b=>{
      ctx.strokeStyle=b.k==='lierne'?'#ffd08a':'#ff9f68';ctx.lineWidth=b.k==='lierne'?3:1.6;
      line(toS(b.a),toS(b.b));
    });
    (res.anns||[]).forEach(an=>{
      const Pp=(u,t)=>toS({x:an.a.x+an.dd.x*u+an.out.x*t,y:an.a.y+an.dd.y*u+an.out.y*t});
      const uA=an.u0-an.ov,uB=an.u1+an.ov,tO=an.P+an.oo;
      ctx.strokeStyle='#ffb347';ctx.lineWidth=2;ctx.setLineDash([7,4]);
      const q=[Pp(uA,0),Pp(uB,0),Pp(uB,tO),Pp(uA,tO)];
      ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);q.slice(1).forEach(z=>ctx.lineTo(z.x,z.y));ctx.closePath();ctx.stroke();
      ctx.setLineDash([]);ctx.lineWidth=1.4;
      an.us.forEach(u=>line(Pp(u,0),Pp(u,an.P+an.oo)));
      ctx.fillStyle='#ffb347';
      an.posts.forEach(u=>{const z=Pp(u,an.P);ctx.beginPath();ctx.arc(z.x,z.y,4,0,Math.PI*2);ctx.fill();});
      const m=Pp((an.u0+an.u1)/2,an.P*0.5);
      label(an.type==='varangue'?'Varangue':'Auvent',m.x,m.y,'#ffb347',12);
    });
    if(hiChain&&res.chains.indexOf(hiChain)>=0){ctx.strokeStyle='#4cc9f0';ctx.lineWidth=5;line(toS(hiChain.o),toS(hiChain.end2));}
    if(opts.showFermes){
      ctx.fillStyle='#f2efe6';
      const dot=p=>{const q=toS(p);ctx.beginPath();ctx.arc(q.x,q.y,2.2,0,Math.PI*2);ctx.fill();};
      res.chains.forEach(ch=>ch.g.posts.forEach(n=>dot({x:ch.o.x+ch.D.x*n.s,y:ch.o.y+ch.D.y*n.s})));
      res.specials.forEach(sp=>sp.g.nodes.forEach(n=>dot({x:sp.g.P.x+sp.g.dir.x*n.x,y:sp.g.P.y+sp.g.dir.y*n.x})));
    }
    if(opts.longueurs){
      res.arcs.forEach(a=>{
        if(a.kind==='rake')return;
        const s1=toS(a.a),s2=toS(a.b);
        if(Math.hypot(s2.x-s1.x,s2.y-s1.y)<46)return;
        label(fmt(a.real),(s1.x+s2.x)/2,(s1.y+s2.y)/2-9,COL[a.kind],11);
      });
    }
    /* planche de rive : tout le contour de la charpente */
    ctx.strokeStyle='#dcb685';ctx.lineWidth=3.5;
    polyPath(res.E);ctx.closePath();ctx.stroke();
  }

  if(poly.length>=2){
    ctx.strokeStyle='#f2efe6';ctx.lineWidth=3;
    polyPath(poly);
    if(closed)ctx.closePath();
    ctx.stroke();
  }
  if(res){
    ctx.strokeStyle='#f78fb3';ctx.lineWidth=5;
    res.W.forEach((a,i)=>{if(!res.gf[i])return;line(toS(a),toS(res.W[(i+1)%res.W.length]));});
  }

  if(opts.cotes&&poly.length>=2){
    const cnt=closed?poly.length:poly.length-1;
    for(let i=0;i<cnt;i++){
      const a=poly[i],b=poly[(i+1)%poly.length];
      const L=Math.hypot(b.x-a.x,b.y-a.y);
      const sa=toS(a),sb=toS(b);
      if(Math.hypot(sb.x-sa.x,sb.y-sa.y)<38)continue;
      let ox,oy;
      if(res){const e=res.edges[i];const m=res.d*view.s+14;ox=-e.n.x*m;oy=-e.n.y*m;}
      else{const dx=sb.x-sa.x,dy=sb.y-sa.y,l=Math.hypot(dx,dy)||1;ox=-dy/l*14;oy=dx/l*14;}
      label((res?(i+1)+' · ':'')+fmt(L)+' m'+(res&&res.gf[i]?' · pignon':''),(sa.x+sb.x)/2+ox,(sa.y+sb.y)/2+oy,res&&res.gf[i]?'#f78fb3':'#8fb3cf',12);
    }
  }

  pts.forEach((p,i)=>{
    const q=toS(p);
    ctx.beginPath();ctx.arc(q.x,q.y,i===0&&!closed?8:6,0,Math.PI*2);
    ctx.fillStyle=i===0&&!closed?'#d9a066':'#14304a';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='#f2efe6';ctx.stroke();
  });

  if(ghost&&!closed){
    const q=toS(ghost.p);
    if(pts.length){
      ctx.setLineDash([6,5]);ctx.strokeStyle='#d9a066';ctx.lineWidth=2;
      line(toS(pts[pts.length-1]),q);
      ctx.setLineDash([]);
      const last=pts[pts.length-1];
      const L=Math.hypot(ghost.p.x-last.x,ghost.p.y-last.y);
      const ang=((Math.atan2(-(ghost.p.y-last.y),ghost.p.x-last.x)*180/Math.PI)+360)%360;
      label(fmt(L)+' m  ·  '+Math.round(ang)+'°',q.x,q.y-24,'#d9a066',13);
    }
    ctx.beginPath();ctx.arc(q.x,q.y,9,0,Math.PI*2);
    ctx.strokeStyle='#d9a066';ctx.lineWidth=2.5;ctx.stroke();
    ctx.beginPath();ctx.arc(q.x,q.y,2.5,0,Math.PI*2);ctx.fillStyle='#d9a066';ctx.fill();
  }
  updateStatus();
}

function updateStatus(){
  const st=$('status'),info=$('info');
  st.className='';
  if(msg){st.textContent=msg;st.className='err';}
  else if(!closed){
    st.textContent=pts.length<3?'Touche l\u2019écran pour poser les coins, ou saisis les cotes avec « Cotes ».':'Rejoins le 1er point (ou « Fermer ») pour générer la charpente.';
  }else if(res){st.textContent=mode3d?'Vue 3D — glisse pour tourner, pince pour zoomer.':'Charpente générée — glisse un coin pour modifier la forme.';}
  else st.textContent='';
  info.textContent=res?('Pente '+opts.pente+'%  ·  débord '+fmt(opts.debord)+' m'):(pts.length+' pt');
}

/* ---------- Interaction 2D ---------- */
function getXY(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function nearestVertex(sx,sy){
  let bi=-1,bd=30;
  pts.forEach((p,i)=>{const q=toS(p),d=Math.hypot(q.x-sx,q.y-sy);if(d<bd){bd=d;bi=i;}});
  return bi;
}
function updateGhost(sx,sy){
  const wp=toW(sx,sy);
  const prevIdx=pts.length?pts.length-1:-1;
  let p=snap(wp,pts.length,prevIdx);
  let close=false;
  if(pts.length>=3){
    const q=toS(pts[0]);
    if(Math.hypot(q.x-sx,q.y-sy)<26){p={x:pts[0].x,y:pts[0].y};close=true;}
  }
  ghost={p,close};
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  const xy=getXY(e);
  pointers.set(e.pointerId,xy);
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    gesture={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,c0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{s:view.s,ox:view.ox,oy:view.oy}};
    ghost=null;drag=-1;draw();return;
  }
  if(!closed){gesture={type:'draw'};updateGhost(xy.x,xy.y);}
  else{
    const vi=nearestVertex(xy.x,xy.y);
    if(vi>=0){drag=vi;gesture={type:'vertex'};}
    else gesture={type:'pan',last:xy,moved:0,t0:Date.now()};
  }
  draw();
});
cv.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const xy=getXY(e);
  pointers.set(e.pointerId,xy);
  if(!gesture)return;
  if(gesture.type==='pinch'&&pointers.size>=2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1,c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const v0=gesture.v0;
    const s=Math.max(3,Math.min(400,v0.s*d/gesture.d0));
    const wx=(gesture.c0.x-v0.ox)/v0.s,wy=(gesture.c0.y-v0.oy)/v0.s;
    view.s=s;view.ox=c.x-wx*s;view.oy=c.y-wy*s;
  }else if(gesture.type==='draw'){
    updateGhost(xy.x,xy.y);
  }else if(gesture.type==='vertex'&&drag>=0){
    const n=pts.length,prevIdx=(drag+n-1)%n;
    pts[drag]=snap(toW(xy.x,xy.y),drag,prevIdx);
    rebuild();
  }else if(gesture.type==='pan'){
    gesture.moved+=Math.hypot(xy.x-gesture.last.x,xy.y-gesture.last.y);
    view.ox+=xy.x-gesture.last.x;view.oy+=xy.y-gesture.last.y;gesture.last=xy;
  }
  draw();
});
function endPointer(e){
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);
  if(gesture&&gesture.type==='draw'&&ghost){
    if(ghost.close){closed=true;rebuild();}
    else{
      const last=pts[pts.length-1];
      if(!last||Math.hypot(last.x-ghost.p.x,last.y-ghost.p.y)>1e-6)pts.push(ghost.p);
    }
  }
  if(gesture&&gesture.type==='pan'&&closed&&gesture.moved<8&&Date.now()-gesture.t0<500)tapWall(gesture.last);
  ghost=null;drag=-1;
  if(pointers.size===0)gesture=null;
  else if(gesture&&gesture.type==='pinch'&&pointers.size<2)gesture=null;
  draw();
  refreshDims();
}
function tapWall(xy){
  const n=pts.length;let bi=-1,bd=22;
  for(let i=0;i<n;i++){
    const a=toS(pts[i]),b=toS(pts[(i+1)%n]);
    const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;
    let t=((xy.x-a.x)*dx+(xy.y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(xy.x-(a.x+dx*t),xy.y-(a.y+dy*t));
    if(d<bd){bd=d;bi=i;}
  }
  if(bi<0)return;
  syncGab();gab[bi]=!gab[bi];
  rebuild();draw();
  if(res)flash('Côté '+(bi+1)+' : '+(gab[bi]?'pignon (mur pignon)':'croupe (pan incliné)'));
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const xy=getXY(e),w=toW(xy.x,xy.y);
  const f=e.deltaY<0?1.15:1/1.15;
  view.s=Math.max(3,Math.min(400,view.s*f));
  view.ox=xy.x-w.x*view.s;view.oy=xy.y-w.y*view.s;
  draw();
},{passive:false});

/* =====================================================================
   VUE 3D (WebGL natif) — caméra en rotation à 360°
   ===================================================================== */
let mode3d=false,gl=null,prog=null,loc={},meshes={},glTex=null,wallGL=null,wallDirty=true,showCover=true,showStruct=true,lastT=0;
const cam={az:35,el:30,dist:20,t:[0,0,0],auto:true,speed:22,drag:false,bright:1.3,ortho:false};
const LIGHT=[1.0,1.3,1.6,1.9];let lightIdx=1;
const texCache={};
let customTex=null,customWall=null;

const VS='attribute vec3 aPos;attribute vec3 aNor;attribute vec2 aUV;attribute vec3 aCol;uniform mat4 uMVP;varying vec3 vN;varying vec2 vUV;varying vec3 vCol;void main(){gl_Position=uMVP*vec4(aPos,1.0);vN=aNor;vUV=aUV;vCol=aCol;}';
const FS='precision mediump float;uniform sampler2D uTex;uniform float uUseTex;uniform float uBright;varying vec3 vN;varying vec2 vUV;varying vec3 vCol;void main(){vec3 n=normalize(vN);vec3 L1=normalize(vec3(0.35,-0.45,0.82));vec3 L2=normalize(vec3(-0.55,0.35,0.45));float l1=max(dot(n,L1),-dot(n,L1)*0.6);float l2=max(dot(n,L2),-dot(n,L2)*0.6);vec3 base=uUseTex>0.5?texture2D(uTex,vUV).rgb*vCol:vCol;vec3 c=base*(0.58+0.55*l1+0.28*l2)*uBright;gl_FragColor=vec4(min(c,vec3(1.0)),1.0);}';

function initGL(){
  try{gl=glcv.getContext('webgl',{antialias:true,alpha:false,preserveDrawingBuffer:true})||glcv.getContext('experimental-webgl');}catch(e){gl=null;}
  if(!gl)return false;
  const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;};
  prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){gl=null;return false;}
  gl.useProgram(prog);
  loc={pos:gl.getAttribLocation(prog,'aPos'),nor:gl.getAttribLocation(prog,'aNor'),uv:gl.getAttribLocation(prog,'aUV'),col:gl.getAttribLocation(prog,'aCol'),
       mvp:gl.getUniformLocation(prog,'uMVP'),tex:gl.getUniformLocation(prog,'uTex'),useTex:gl.getUniformLocation(prog,'uUseTex'),bright:gl.getUniformLocation(prog,'uBright')};
  gl.enableVertexAttribArray(loc.pos);gl.enableVertexAttribArray(loc.nor);gl.enableVertexAttribArray(loc.uv);gl.enableVertexAttribArray(loc.col);
  return true;
}

function mkMesh(arr){
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);
  return{b,n:arr.length/11};
}
function drawMesh(m,useTex){
  if(!m||!m.n)return;
  gl.bindBuffer(gl.ARRAY_BUFFER,m.b);
  gl.vertexAttribPointer(loc.pos,3,gl.FLOAT,false,44,0);
  gl.vertexAttribPointer(loc.nor,3,gl.FLOAT,false,44,12);
  gl.vertexAttribPointer(loc.uv,2,gl.FLOAT,false,44,24);
  gl.vertexAttribPointer(loc.col,3,gl.FLOAT,false,44,32);
  gl.uniform1f(loc.useTex,useTex?1:0);
  gl.drawArrays(gl.TRIANGLES,0,m.n);
}

function coverCanvas(size){
  if(opts.couleur==='image'&&customTex)return customTex;
  const key=opts.couv+opts.couleur+size;
  return texCache[key]||(texCache[key]=genTexture(opts.couv,COLORS[opts.couleur].hex,size));
}
function makeTex(c){
  const t=gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  const an=gl.getExtension('EXT_texture_filter_anisotropic')||gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
  if(an)gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  return t;
}
const wallCache={};
function wallCanvas(size){
  if(opts.mur==='image'&&customWall)return customWall;
  const k=opts.mur+size;
  return wallCache[k]||(wallCache[k]=genWallTexture(opts.mur,size));
}
function uploadTex(){
  if(glTex)gl.deleteTexture(glTex);
  glTex=makeTex(coverCanvas(512));
  gl.uniform1i(loc.tex,0);
  texDirty=false;
}
function uploadWall(){
  if(wallGL)gl.deleteTexture(wallGL);
  wallGL=makeTex(wallCanvas(512));
  wallDirty=false;
}
function metalColor(){
  if(opts.couleur==='image'||!COLORS[opts.couleur])return rgbf('#8f969c');
  return rgbf(COLORS[opts.couleur].hex);
}
function capColor(){return metalColor().map(v=>v*0.82);}
function rebuild3D(){
  dirty3d=false;
  if(!res)return;
  const tile=opts.couleur==='image'?1.5:COUV[opts.couv].tile;
  const wd=(opts.mur==='image'||!WALLS[opts.mur])?{tw:1.5,th:1.5}:WALLS[opts.mur];
  const dc=opts.decoCol==='tole'?metalColor():rgbf(DECOLORS[opts.decoCol].hex);
  const sc=build3D(res,{pente:opts.pente,hMur:opts.hMur,tile,wallTW:wd.tw,wallTH:wd.th,deco:opts.deco,decoCol:dc,decoSize:opts.decoSize,capW:COUV[opts.couv].cap,capCol:capColor(),metalCol:metalColor(),
    ligAret:opts.ligAret,ligNoue:opts.ligNoue,ligFait:opts.ligFait,lattesEsp:opts.lattes,rive:opts.rive,gout:opts.gout,contre:opts.contre,retro:opts.retro,solivage:opts.solivage,solEsp:opts.solEsp,lucRive:opts.lucRive});
  ['env','st','cv','cp','rv','rm','wl'].forEach(k=>{if(meshes[k])gl.deleteBuffer(meshes[k].b);meshes[k]=mkMesh(sc[k]);});
  cam.t=sc.target;
  cam.dist=Math.max(8,sc.size*1.55+3);
}

function render3D(){
  if(dirty3d)rebuild3D();
  if(texDirty)uploadTex();
  if(wallDirty)uploadWall();
  if(!meshes.env)return;
  gl.viewport(0,0,glcv.width,glcv.height);
  gl.clearColor(0.36,0.56,0.76,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  const az=cam.az*Math.PI/180,el=cam.el*Math.PI/180;
  const eye=[cam.t[0]+cam.dist*Math.cos(el)*Math.cos(az),cam.t[1]+cam.dist*Math.cos(el)*Math.sin(az),cam.t[2]+cam.dist*Math.sin(el)];
  const V=mLook(eye,cam.t,[0,0,1]);
  const asp=glcv.width/glcv.height;
  const P=cam.ortho?mOrtho(cam.dist*Math.tan(25*Math.PI/180),asp,0.2,900):mPersp(50*Math.PI/180,asp,0.2,900);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(loc.mvp,false,new Float32Array(mMul(P,V)));
  gl.uniform1f(loc.bright,cam.bright);
  drawMesh(meshes.env,false);
  gl.bindTexture(gl.TEXTURE_2D,wallGL);drawMesh(meshes.wl,true);
  if(showStruct)drawMesh(meshes.st,false);
  drawMesh(meshes.rv,false);
  if(showCover)drawMesh(meshes.rm,false);
  if(showCover){gl.bindTexture(gl.TEXTURE_2D,glTex);drawMesh(meshes.cv,true);drawMesh(meshes.cp,false);}
}

function frame(t){
  if(!mode3d)return;
  const dt=Math.min(0.1,((t-lastT)/1000)||0);lastT=t;
  if(cam.auto&&!cam.drag)cam.az+=dt*cam.speed;
  render3D();
  requestAnimationFrame(frame);
}

function set3D(on){
  if(on){
    if(!res){flash('Ferme d\u2019abord le contour pour générer la charpente.');return;}
    if(!gl&&!initGL()){flash('La 3D n\u2019est pas disponible sur cet appareil.');return;}
  }
  mode3d=on;
  cv.style.display=on?'none':'block';
  glcv.style.display=on?'block':'none';
  $('ui3d').style.display=on?'flex':'none';
  $('views3d').style.display=on?'flex':'none';
  $('b3d').innerHTML=on?'<b>▭</b>2D':'<b>◈</b>3D';
  if(on){resize();lastT=performance.now();requestAnimationFrame(frame);}
  else{resize();draw();}
  updateStatus();
}
$('b3d').onclick=()=>set3D(!mode3d);

/* contrôles 3D */
const gp=new Map();
glcv.addEventListener('pointerdown',e=>{
  glcv.setPointerCapture(e.pointerId);
  gp.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cam.drag=true;
});
glcv.addEventListener('pointermove',e=>{
  const p=gp.get(e.pointerId);
  if(!p)return;
  if(gp.size>=2){
    const ids=[...gp.keys()],o=ids.map(i=>gp.get(i));
    const d0=Math.hypot(o[0].x-o[1].x,o[0].y-o[1].y);
    gp.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const n=ids.map(i=>gp.get(i));
    const d1=Math.hypot(n[0].x-n[1].x,n[0].y-n[1].y);
    if(d0>0&&d1>0)cam.dist=Math.max(3,Math.min(300,cam.dist*d0/d1));
  }else{
    if(cam.ortho){cam.ortho=false;markView('p');}
    cam.az-=(e.clientX-p.x)*0.4;
    cam.el=Math.max(4,Math.min(88,cam.el+(e.clientY-p.y)*0.3));
    gp.set(e.pointerId,{x:e.clientX,y:e.clientY});
  }
});
function endGl(e){gp.delete(e.pointerId);if(!gp.size)cam.drag=false;}
glcv.addEventListener('pointerup',endGl);
glcv.addEventListener('pointercancel',endGl);
glcv.addEventListener('webglcontextlost',e=>{e.preventDefault();meshes={};glTex=null;});
glcv.addEventListener('webglcontextrestored',()=>{gl=null;meshes={};if(initGL()){dirty3d=true;texDirty=true;}});
glcv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(3,Math.min(300,cam.dist*(e.deltaY>0?1.1:1/1.1)));},{passive:false});

$('gRot').onclick=()=>{cam.auto=!cam.auto;if(cam.auto&&cam.ortho){cam.ortho=false;markView('p');}$('gRot').className=cam.auto?'on':'';$('gRot').textContent=cam.auto?'⏸ Rotation':'▶ Rotation';};

/* ---------- plan de débit ---------- */
function groupBars(list){
  const m=new Map();
  list.forEach(b=>{
    const key=b.items.map(x=>x.t+':'+x.L.toFixed(2)+(x.rab?'r':'')).join('|');
    if(!m.has(key))m.set(key,{b,n:0});
    m.get(key).n++;
  });
  return[...m.values()].sort((x,y)=>y.n-x.n);
}
function debitHtml(titre,pk){
  const f=fmt,tot=pk.bars*pk.stock;
  let h='<h4>'+titre+'</h4>'+
    '<div class="row"><span>Barres de '+pk.stock+' m à commander</span><span><b>'+pk.bars+'</b></span></div>'+
    '<div class="row"><span>Chute totale</span><span>'+f(pk.chute)+' m ('+(tot?Math.round(100*pk.chute/tot):0)+' %)</span></div>';
  groupBars(pk.list).forEach(g=>{
    const ch=Math.max(0,pk.stock-g.b.used);
    h+='<div class="cut"><b>'+g.n+' barre'+(g.n>1?'s':'')+'</b> identique'+(g.n>1?'s':'')+' · chute '+f(ch)+' m<br>'+
      g.b.items.map(x=>'<b>'+f(x.L)+'</b> m '+(TNAME[x.t]||x.t).toLowerCase()+(x.rab?' (raboutée)':'')).join(' + ')+'</div>';
  });
  return h;
}
function openDebit(){
  if(!res)return;
  const s=res.stats;
  openSheet('<h3>Plan de débit</h3>'+
    '<p class="note">Barre par barre : quelles pièces couper dans chaque barre. Les pièces plus longues qu\u2019une barre sont raboutées. Trait de scie compté : '+Math.round(opts.kerf*1000)+' mm.</p>'+
    debitHtml('Bastaings 12 × 4 cm',s.bast)+debitHtml('Lattes 8 × 4 cm',s.latt)+
    '<div class="nav"><button id="nBack">← Récapitulatif</button></div>');
  $('nBack').onclick=()=>$('bRecap').onclick();
}

/* ---------- quantités de tôles ---------- */
function openTole(){
  if(!res)return;
  const s=res.stats,f=fmt,C=COUV[opts.couv];
  let h='<h3>Quantités de couverture</h3>';
  if(!(C.utile>0)||!s.sheets.length){
    const n=Math.ceil(s.realArea*opts.tuilesM2*1.05);
    h+='<div class="row"><span>'+C.nom+' : surface de couverture</span><span>'+f(s.realArea)+' m²</span></div>'+
       '<div class="row"><span>Nombre de tuiles ('+opts.tuilesM2+' au m² + 5 %)</span><span><b>'+n+'</b></span></div>';
  }else{
    let nT=0,lT=0;
    const groups=lens=>{const m={};lens.forEach(L=>{m[L.toFixed(2)]=(m[L.toFixed(2)]||0)+1;});
      return Object.keys(m).sort((a,b)=>b-a).map(k=>m[k]+' × '+f(Number(k))+' m').join(' + ');};
    s.sheets.forEach(p=>{
      nT+=p.lens.length;lT+=p.lens.reduce((a,b)=>a+b,0);

      h+='<div class="cut"><b>'+p.label+'</b> · '+p.lens.length+(opts.couv==='metro'?' bande':' feuille')+(p.lens.length>1?'s':'')+'<br>'+groups(p.lens)+(pn?'<br>soit '+pn+' tôles de 1,40 × 0,40 (utile 1,34 × 0,35)':'')+'</div>';
    });
    const nPanT=(opts.couv==='metro')?s.sheets.reduce((a,p)=>a+p.lens.reduce((x,L)=>x+Math.ceil(L/C.panL-1e-9),0),0):0;
    h+='<h4>Total ('+C.nom+', largeur utile '+f(opts.utile)+' m)</h4>'+
      (nPanT?'<div class="row"><span>Tôles 1,40 × 0,40 (+ 7 % de chute)</span><span><b>'+Math.ceil(nPanT*1.07-1e-9)+'</b></span></div>':'')+
      '<div class="row"><span>'+(opts.couv==='metro'?'Bandes':'Feuilles')+'</span><span><b>'+nT+'</b></span></div>'+
      '<div class="row"><span>Longueur cumulée</span><span>'+f(lT)+' m</span></div>'+
      '<div class="row"><span>Tôle faîtière ('+Math.round(C.cap*100)+' cm)</span><span>'+f(s.capLen)+' m</span></div>'+
      '<label style="margin-top:8px">Largeur utile d\u2019une feuille (m)<input id="iUt" type="text" inputmode="decimal" value="'+String(opts.utile).replace('.',',')+'"></label>'+
      '<p class="note">Chaque feuille est commandée à la longueur du rampant du pan (arrondie aux 5 cm). Sur les pans de croupe, la longueur est celle du point le plus long de la bande. Ajuste la largeur utile selon ton fournisseur.</p>';
  }
  h+='<div class="nav"><button id="nBack">← Récapitulatif</button></div>';

/* ---------- coupe de ferme cotée ---------- */
function openCoupe(idx){
  if(!res)return;
  const list=res.chains.filter(c=>c.g);
  if(!list.length){openSheet('<h3>Coupe de ferme</h3><p>Aucune ferme courante à afficher.</p>');return;}
  if(idx<0){
    idx=0;
    list.forEach((c,i)=>{if(c.end==='eave'&&c.g.entLen>list[idx].g.entLen)idx=i;});
  }
  idx=((idx%list.length)+list.length)%list.length;
  const ch=list[idx],g=ch.g,f=fmt;
  hiChain=ch;draw();
  const pieces=[];
  ch.segs.forEach((sg,i)=>pieces.push(['Arbalétrier '+(ch.segs.length>1?(i+1):''),Math.hypot(sg.s1-sg.s0,g.zT(sg.s1)-g.zT(sg.s0))]));
  pieces.push(['Entrait',g.entLen]);
  g.posts.forEach((p,i)=>pieces.push(['Fiche F'+(i+1),p.h]));
  g.diags.forEach((q,i)=>pieces.push(['Diagonale D'+(i+1),q.len]));
  g.ties.forEach((t,i)=>pieces.push(['Entrait retroussé R'+(i+1),t.sb-t.sa]));
  const type=ch.float?'ferme partant de l\u2019arêtier, butée sur la noue':(ch.end==='eave'?'ferme complète':'demi-ferme butée sur arêtier / noue');
  openSheet('<h3>Coupe de ferme</h3>'+
    '<div class="nav"><button id="cPrev">◀</button><button id="cInfo" style="flex:3">Ferme '+(idx+1)+' / '+list.length+' · '+type+'</button><button id="cNext">▶</button></div>'+
    '<canvas id="cCoupe" class="coupe" width="680" height="360"></canvas>'+
    '<h4>Pièces de cette ferme</h4>'+
    pieces.map(q=>'<div class="row"><span>'+q[0]+'</span><span>'+f(q[1])+' m</span></div>').join('')+
    '<div class="nav"><button id="nBack">← Récapitulatif</button></div>');
  $('cPrev').onclick=()=>openCoupe(idx-1);
  $('cNext').onclick=()=>openCoupe(idx+1);
  $('nBack').onclick=()=>$('bRecap').onclick();
  drawCoupe($('cCoupe'),ch);
}
function drawCoupe(cvEl,ch){
  const c=cvEl.getContext('2d'),W=cvEl.width,H=cvEl.height,g=ch.g,f=fmt;
  c.clearRect(0,0,W,H);
  const X=ch.sEnd,zE=g.zE,top=g.Hmax;
  const mL=26,mR=40,mT=78,mB=96;
  const sc=Math.min((W-mL-mR)/X,(H-mT-mB)/(top+zE+0.7));
  const x0=mL+((W-mL-mR)-X*sc)/2;
  const yBase=mT+(top+0.05)*sc;                // y écran de l'entrait
  const PX=s=>x0+s*sc,PY=h=>yBase-h*sc;
  const line=(a,b,col,w)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();};
  const txt=(t,x,y,col,sz,al)=>{c.fillStyle=col;c.font=(sz||18)+'px system-ui,sans-serif';c.textAlign=al||'center';c.textBaseline='middle';c.fillText(t,x,y);};
  // murs (appuis)
  const wall=(s0,s1)=>{c.fillStyle='#8a8f93';c.fillRect(PX(s0),PY(0),(s1-s0)*sc,0.6*sc);c.strokeStyle='#cfd3d6';c.lineWidth=1;c.strokeRect(PX(s0),PY(0),(s1-s0)*sc,0.6*sc);};
  if(!ch.float)wall(g.d,g.d+0.2);
  if(ch.end==='eave')wall(ch.sEnd-g.d-0.2,ch.sEnd-g.d);
  // arbalétriers
  ch.segs.forEach(sg=>line([PX(sg.s0),PY(g.zT(sg.s0)-zE)],[PX(sg.s1),PY(g.zT(sg.s1)-zE)],'#d98b4a',5));
  // entrait
  line([PX(g.sS),PY(0)],[PX(g.sE),PY(0)],'#c9803f',5);
  // fiches
  g.posts.forEach((p,i)=>{
    line([PX(p.s),PY(0)],[PX(p.s),PY(p.h)],'#f0c27b',3);
    txt('F'+(i+1),PX(p.s),PY(p.h)-11,'#f0c27b',13);
  });
  // diagonales
  g.diags.forEach(q=>{
    const A=g.list.find(n=>Math.abs(n.s-q.s0)<1e-6),B=g.list.find(n=>Math.abs(n.s-q.s1)<1e-6);
    if(!A||!B)return;
    if(q.up==='b')line([PX(q.s0),PY(0)],[PX(q.s1),PY(B.h)],'#e7b46c',2);
    else line([PX(q.s0),PY(A.h)],[PX(q.s1),PY(0)],'#e7b46c',2);
  });
  // entraits retroussés
  g.ties.forEach(t=>line([PX(t.sa),PY(t.h)],[PX(t.sb),PY(t.h)],'#c9803f',4));
  // cotes
  const dim=(sa,sb,y,label,col)=>{
    line([PX(sa),y],[PX(sb),y],col,1.5);
    [sa,sb].forEach(s=>line([PX(s),y-7],[PX(s),y+7],col,1.5));
    txt(label,(PX(sa)+PX(sb))/2,y-12,col,17);
  };
  const yd1=PY(0)+0.6*sc+26,yd2=yd1+30;
  const wA=ch.float?0:g.d,wB=ch.end==='eave'?ch.sEnd-g.d:ch.sEnd;
  dim(wA,wB,yd1,(ch.end==='eave'?'Portée ':'Appui → ')+f(wB-wA)+' m','#9fd4ff');
  dim(0,X,yd2,'Entrait total '+f(X)+' m (débords inclus)','#8fb3cf');
  // poinçon (hauteur max)
  let pk=g.list[0];g.list.forEach(n=>{if(n.h>pk.h)pk=n;});
  const xp=PX(pk.s);
  line([xp+16,PY(0)],[xp+16,PY(pk.h)],'#ffd08a',1.5);
  line([xp+9,PY(0)],[xp+23,PY(0)],'#ffd08a',1.5);line([xp+9,PY(pk.h)],[xp+23,PY(pk.h)],'#ffd08a',1.5);
  const ang=Math.atan(res.slope)*180/Math.PI;
  txt('Pente '+Math.round(res.slope*100)+' % ('+f(ang)+'°)',mL,18,'#b7e07a',18,'left');
  txt('Poinçon '+f(pk.h)+' m (au-dessus de l\u2019entrait)',mL,42,'#ffd08a',18,'left');
}

/* ---------- Tracé par cotes (boîte de dialogue) ---------- */
const dim={angle:0};
const DIRS=[[135,'↖'],[90,'↑'],[45,'↗'],[180,'←'],null,[0,'→'],[225,'↙'],[270,'↓'],[315,'↘']];
const ARROWS=['→','↗','↑','↖','←','↙','↓','↘'];
const normA=a=>((a%360)+360)%360;
const arrowFor=a=>ARROWS[Math.round(normA(a)/45)%8];
const dirVec=a=>{const r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return{x:Math.abs(c)<1e-12?0:c,y:Math.abs(s)<1e-12?0:-s};};
const r6=v=>Math.round(v*1e6)/1e6;
const num=str=>parseFloat(String(str).replace(',','.').trim());

function flash(m){
  msg=m;updateStatus();
  const st=$('status');st.className='err';
  setTimeout(()=>{if(msg===m){msg='';updateStatus();}},2600);
}
function sideAngle(i){
  const a=pts[i-1],b=pts[i];
  return Math.atan2(-(b.y-a.y),b.x-a.x)*180/Math.PI;
}

function openDims(){
  if(mode3d)set3D(false);
  if(closed){
    openSheet('<h3>Tracé par cotes</h3><p style="font-size:14px;line-height:1.45">Le contour est déjà fermé. Pour saisir un nouveau bâtiment, efface-le d\u2019abord.</p><button id="dNew" class="dBtn main">Nouveau contour</button>');
    dimsOpen=true;
    $('dNew').onclick=()=>{clearAll();openDims();};
    fit();draw();
    return;
  }
  openSheet(
    '<h3>Tracé par cotes</h3>'+
    '<div id="dInfo"></div><div id="dSides"></div>'+
    '<div class="dirs">'+DIRS.map(d=>d?'<button data-a="'+d[0]+'">'+d[1]+'</button>':'<span id="dAng"></span>').join('')+'</div>'+
    '<label>Longueur du côté (m)<input id="dLen" type="text" inputmode="decimal" autocomplete="off" placeholder="ex. 10,50"></label>'+
    '<label>Autre angle (°)<input id="dAngIn" type="text" inputmode="decimal" autocomplete="off" placeholder="0 = Est, 90 = Nord"></label>'+
    '<button id="dAdd" class="dBtn main">Ajouter ce côté</button>'+
    '<div id="dHint"></div>'+
    '<div class="dRow"><button id="dUndo" class="dBtn">Annuler le dernier</button><button id="dClose" class="dBtn">Fermer le contour</button></div>'
  );
  dimsOpen=true;
  dim.angle=pts.length>=2?normA(Math.round(sideAngle(pts.length-1)/45)*45-90):0;
  sheetBody.querySelectorAll('.dirs button').forEach(b=>b.onclick=()=>{
    dim.angle=Number(b.dataset.a);$('dAngIn').value='';refreshDims();$('dLen').focus();
  });
  $('dAngIn').oninput=e=>{const v=num(e.target.value);if(isFinite(v)){dim.angle=normA(v);refreshDims();}};
  $('dLen').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addSide();}};
  $('dAdd').onclick=addSide;
  $('dUndo').onclick=undoSide;
  $('dClose').onclick=closeFromDims;
  fit();draw();refreshDims();
  setTimeout(()=>{const i=$('dLen');if(i)i.focus();},60);
}

function refreshDims(){
  if(!dimsOpen)return;
  if(closed){openDims();return;}
  if(!$('dInfo'))return;
  const n=pts.length;
  $('dInfo').textContent=n===0
    ?'Le tracé démarre au point (0 ; 0). Choisis une direction, puis la longueur du 1er côté.'
    :'Côté n° '+n+' : choisis la direction, puis la longueur.';
  if(n>=2){
    const parts=[];
    for(let i=1;i<n;i++)parts.push(arrowFor(sideAngle(i))+' '+fmt(Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y))+' m');
    $('dSides').textContent=parts.join('   ·   ');
  }else $('dSides').textContent='Aucun côté pour l\u2019instant.';
  sheetBody.querySelectorAll('.dirs button').forEach(b=>b.classList.toggle('on',Number(b.dataset.a)===dim.angle));
  $('dAng').textContent=(Math.round(dim.angle*10)/10)+'°';
  $('dClose').disabled=n<3;
  $('dUndo').disabled=n<1;
  let hint='';
  if(n>=3){
    const dx=pts[0].x-pts[n-1].x,dy=pts[0].y-pts[n-1].y,d=Math.hypot(dx,dy);
    if(d<1e-6)hint='Le dernier point est sur le départ.';
    else if(Math.abs(dy)<1e-6)hint='Pour fermer : '+fmt(Math.abs(dx))+' m vers '+(dx>0?'l\u2019Est →':'l\u2019Ouest ←');
    else if(Math.abs(dx)<1e-6)hint='Pour fermer : '+fmt(Math.abs(dy))+' m vers '+(dy<0?'le Nord ↑':'le Sud ↓');
    else hint='Retour au départ : '+fmt(Math.abs(dx))+' m en horizontal, '+fmt(Math.abs(dy))+' m en vertical.';
  }
  $('dHint').textContent=hint;
}

function addSide(){
  const L=num($('dLen').value);
  if(!(L>0&&L<500)){flash('Saisis une longueur valide, en mètres.');$('dLen').focus();return;}
  if(!pts.length)pts.push({x:0,y:0});
  const v=dirVec(dim.angle),last=pts[pts.length-1];
  const p={x:r6(last.x+v.x*L),y:r6(last.y+v.y*L)};
  if(pts.length>=3&&Math.hypot(p.x-pts[0].x,p.y-pts[0].y)<1e-4){
    closed=true;rebuild();closeSheet();fit();draw();return;
  }
  pts.push(p);
  $('dLen').value='';$('dAngIn').value='';
  dim.angle=normA(Math.round(dim.angle/45)*45-90);
  fit();draw();refreshDims();
  $('dLen').focus();
}
function undoSide(){
  if(!pts.length)return;
  if(pts.length>=2)dim.angle=normA(Math.round(sideAngle(pts.length-1)/45)*45);
  pts.pop();
  if(pts.length===1)pts=[];
  rebuild();fit();draw();refreshDims();
}
function closeFromDims(){
  if(pts.length<3){flash('Il faut au moins 3 points.');return;}
  closed=true;rebuild();closeSheet();fit();draw();
}

const LS_PROJ='charpente.projets.v1',LS_AUTO='charpente.auto.v1';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}};
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function snapshot(){return{v:1,pts:pts.map(p=>({x:p.x,y:p.y})),gab:gab.slice(0,pts.length),closed,opts:JSON.parse(JSON.stringify(opts))};}
function applySnapshot(d){
  if(!d||!Array.isArray(d.pts))return false;
  if(mode3d)set3D(false);
  pts=d.pts.map(p=>({x:Number(p.x)||0,y:Number(p.y)||0}));
  gab=(d.gab||[]).map(Boolean);
  closed=!!d.closed&&pts.length>=3;
  Object.assign(opts,d.opts||{});
  ['anns','lucs'].forEach(k=>{if(!Array.isArray(opts[k]))opts[k]=[];});
  if(!opts.prix||typeof opts.prix!=='object')opts.prix={};
  if(!COUV[opts.couv])opts.couv='ondulee';
  if(opts.couleur==='image'?!customTex:!COLORS[opts.couleur])opts.couleur='rouge';
  if(opts.mur==='image'?!customWall:!WALLS[opts.mur])opts.mur='enduit';
  if(!d.opts||d.opts.utileVer!==3){opts.utileVer=3;if(COUV[opts.couv].utile>0)opts.utile=COUV[opts.couv].utile;}
  if(!d.opts||!d.opts.dfVer||d.opts.dfVer<3){opts.rive=0.33;opts.contre=false;}
  if(!d.opts||!d.opts.dfVer||d.opts.dfVer<4){opts.retro=50;opts.lucRive=0.2;}
  opts.dfVer=4;
  texDirty=true;wallDirty=true;dirty3d=true;
  closeSheet();rebuild();fit();draw();
  return true;
}
function downloadBlob(blob,name){
  /* dans l'APK (WebView Android) : le téléchargement par lien ne marche pas, on passe par le pont Kotlin « AndroidBridge » */
  if(window.AndroidBridge&&typeof window.AndroidBridge.saveFile==='function'){
    const rd=new FileReader();
    rd.onload=()=>{const b64=String(rd.result).split(',')[1]||'';window.AndroidBridge.saveFile(name,blob.type||'application/octet-stream',b64);};
    rd.readAsDataURL(blob);
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}

  sheetBody.querySelectorAll('button[data-pd]').forEach(b=>b.onclick=()=>{const arr=lsGet(LS_PROJ)||[];arr.splice(Number(b.dataset.pd),1);lsSet(LS_PROJ,arr);openProjets();});

    if(!pts.length){flash('Rien à exporter.');return;}

  };
  $('pImp').onclick=()=>$('pFile').click();
  $('pFile').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{let d=null;try{d=JSON.parse(rd.result);}catch(x){}if(!applySnapshot(d))flash('Fichier de projet illisible.');};
    rd.readAsText(f);
  };
}

/* ---------- devis estimatif (même présentation que le devis modèle) ---------- */
const LS_LOGO='charpente.logo.v1';
const DV0={nom:'EXPRESS CONSTRUCTION BOIS',tel:'672 04 14 52 / 693 68 28 49',titre:'Devis estimatif d\u2019une charpente',client:'',projet:'',ver:3,
  lPlanche:5,lGout:4,lNoue:4,lBande:4,lFait:4,tendE:0.7,naissE:8,lisseW:1,lisseChute:4,moMode:'pct',moVal:18.6,q:{}};
const PRIX0={bast:2700,latt:1700,planche:7000,p80:4500,p90:4500,p30:5500,gout:7000,fait:7000,bande:7000,noue:7000,angG:1500,naiss:500,tend:100,fix:100,torsa:4500,fixP:0,riv:5000,tole:4300,faitA:7000,toit:6000,lisse:4300,transport:20000};
const dvOf=()=>{
  const old=opts.dv||{};
  opts.dv=Object.assign({},DV0,old);
  if(!old.ver||old.ver<2){opts.dv.tendE=0.7;opts.dv.lisseW=1;opts.dv.lisseChute=4;}
  if(!old.ver||old.ver<3){opts.dv.lPlanche=5;opts.dv.ver=3;}
  if(!opts.dv.q||typeof opts.dv.q!=='object')opts.dv.q={};
  return opts.dv;
};
const prixOf=k=>{const v=(opts.prix||{})[k];return(v==null||v==='')?(PRIX0[k]||0):v;};
const nf=n=>(Math.round(n)+'').replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const money=n=>nf(n)+' FCFA';
const qf=q=>Math.abs(q-Math.round(q))<1e-9?String(Math.round(q)):String(+q.toFixed(2)).replace('.',',');

/* Quantités calculées d'après la forme et le type de tôle : seules les lignes utiles apparaissent */
const paquets=(L,par,seuil)=>{                 // 1 paquet par « par » ml ; un paquet de plus dès que le reste atteint « seuil »
  if(L<=0)return 0;
  let n=Math.floor(L/par+1e-9);
  if(L-n*par>=seuil-1e-9)n++;
  return Math.max(1,n);
};
const paquets90=(L,par,seuil)=>{const n=paquets(L,par,seuil);return n>0?Math.max(1,Math.ceil(n*0.9-1e-9)):0;};   // -10 % sur les pointes 80/90
function devisModel(){
  const s=res.stats,dv=dvOf(),C=COUV[opts.couv],kind=opts.couv;
  const cl=x=>Math.max(0,Math.ceil(x-1e-9));
  const riveLen=s.rive+(s.rakeLen||0)+(s.lucRake||0)+(s.lucEave||0),gutLen=opts.gout?s.rive+(s.annGut||0):0;
  const capL=(s.capRidge||0)+(s.capHip||0);
  const toleLin=s.sheets.reduce((a,p)=>a+p.lens.reduce((x,y)=>x+y,0),0);
  const fine=(kind==='tuiles'||kind==='metro');           // lattes plus serrées : plus de pointes
  const A=[];
  const add=(k,nom,u,q,sh)=>{if(q>0||(dv.q[k]!=null&&dv.q[k]>0))A.push({k,nom,u,auto:q,s:sh});};
  add('bast','Bastaings 12 × 4 cm ('+opts.piece+' m)','pièce',s.bast.bars,'Bastaings 12 × 4');
  add('latt','Lattes 8 × 4 cm ('+opts.piece+' m)','pièce',s.latt.bars,'Lattes 8 × 4');
  add('planche','Planche de rive','pièce',cl(riveLen/dv.lPlanche));
  add('p80','Pointes de 80 (fermes, paquet de 4 kg)','paquet',fine?paquets90(toleLin,40,5):paquets90(toleLin,50,10),'Pointes de 80');
  add('p90','Pointes de 90 (pannes, paquet de 4 kg)','paquet',fine?paquets90(toleLin,30,5):paquets90(toleLin,60,10),'Pointes de 90');
  add('p30','Pointes de 30 (tôle lisse, 4 kg)','paquet',1,'Pointes de 30');
  add('gout','Gouttières de '+fmt(dv.lGout)+' m','pièce',cl(gutLen/dv.lGout));
  add('fait','Faîtière','pièce',cl(capL/dv.lFait));
  add('bande','Bandes de rive','pièce',cl((s.rive+(s.lucEave||0))/dv.lBande));
  add('noue','Noues '+fmt(dv.lNoue)+' m','pièce',cl((s.valley||0)/dv.lNoue));
  add('angG','Angles gouttières','pièce',gutLen>0?s.gutCorners:0);
  add('naiss','Naissances gouttières','pièce',cl(gutLen/dv.naissE));
  add('tend','Tendeurs gouttières','pièce',cl(gutLen/dv.tendE));
  if(kind==='bac')add('fix','Fixation complète (3 par ml de tôle)','pièce',cl(3*toleLin),'Fixation complète');
  else if(kind==='tuiles')add('fix','Fixation complète (4 par ml de tôle)','pièce',cl(4*toleLin),'Fixation complète');
  else if(kind==='ondulee')add('torsa','Pointes torsadées (1 paquet / 25 ml)','paquet',cl(toleLin/25),'Pointes torsadées');
  else add('fixP','Fixation complète (1 paquet / 100 ml)','paquet',cl(toleLin/100),'Fixation complète');
  add('riv','Rivets (paquet de 1000)','paquet',paquets(toleLin,250,10),'Rivets');
  if(kind==='metro'){
    const nPan=s.sheets.reduce((a,p)=>a+p.lens.reduce((x,L)=>x+Math.ceil(L/C.panL-1e-9),0),0);
    add('tole','Métrobond 1,40 × 0,40 (7 % de chute)','pièce',Math.ceil(nPan*1.07-1e-9),'Métrobond 1,4 × 0,4');
  }else add('tole','Tôles en ml ('+C.nom+')','ml',Math.round(toleLin*100)/100,'Tôles en ml');
  add('faitA','Faîtière d\u2019angle (rives de pignon)','pièce',cl(((s.rakeLen||0)+(s.lucRake||0))/dv.lFait),'Faîtière d\u2019angle');
  let toit=0;
  if(kind==='metro')toit=cl(s.realArea/30);
  else if(kind==='ondulee')toit=cl(toleLin/(opts.gout?100:150));
  else toit=cl(toleLin/(opts.gout?60:100));
  add('toit','Toiturol (boîte)','boîte',toit,'Toiturol');
  const lisse=cl((((s.perim||0)*res.d)+(s.lucLisse||0))*(1+dv.lisseChute/100)/Math.max(0.1,dv.lisseW));
  add('lisse','Tôle lisse (sous-face des débords)','ml',lisse,'Tôle lisse');
  A.push({k:'transport',nom:'Transport',u:'forfait',auto:1});
  let mat=0;
  A.forEach((r,i)=>{
    r.n=i+1;
    const ov=dv.q[r.k];
    r.q=(ov!=null&&isFinite(ov))?ov:r.auto;
    r.pu=prixOf(r.k);r.tot=r.q*r.pu;mat+=r.tot;
  });
  const mo=dv.moMode==='m2'?s.realArea*dv.moVal:(dv.moMode==='forfait'?dv.moVal:mat*dv.moVal/100);
  return{rows:A,mat,mo,total:mat+mo,dv,area:s.realArea};
}

/* Page du devis dessinée comme le modèle : en-tête, tableau à 5 colonnes, totaux */
function drawDevis(c,M,img){
  const dv=M.dv,W=1200,n=M.rows.length;
  const rowH=Math.max(30,Math.min(41,Math.floor(1010/(n+1.7)))),hdrH=Math.round(rowH*1.75),top=430;
  const H=Math.max(1700,top+hdrH+n*rowH+360);
  c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  g.strokeStyle='#111';g.lineWidth=2;g.strokeRect(48,48,W-96,H-96);
  const T=(t,x,y,font,col,al)=>{g.font=font;g.fillStyle=col||'#111';g.textAlign=al||'left';g.textBaseline='middle';g.fillText(t,x,y);};
  let tx=145;
  if(img){const r=Math.min(275/img.width,215/img.height);g.drawImage(img,145,140,img.width*r,img.height*r);tx=450;}
  T(dv.nom,tx,172,'bold 42px Georgia,serif','#1b4f9c');
  if(dv.tel){T('TEL:',tx,250,'bold 38px Georgia,serif','#1b4f9c');T(dv.tel,tx+100,250,'38px Georgia,serif');}
  T(dv.titre,tx,320,'bold 36px Georgia,serif','#1b4f9c');
  const w=g.measureText(dv.titre).width;g.fillStyle='#1b4f9c';g.fillRect(tx,342,w,3);
  const info=[dv.client?'Client : '+dv.client:'',dv.projet?'Projet : '+dv.projet:'','Date : '+new Date().toLocaleDateString('fr-FR')].filter(Boolean).join('   ·   ');
  T(info,130,392,'24px Georgia,serif','#333');
  const xs=[130,192,540,698,906,1076],labels=['N°','Désignation','Quantités','Prix unitaire','Prix total'];
  g.strokeStyle='#111';g.lineWidth=1.5;
  const ys=[top,top+hdrH];for(let i=1;i<=n;i++)ys.push(top+hdrH+i*rowH);
  ys.forEach(y=>{g.beginPath();g.moveTo(xs[0],y);g.lineTo(xs[5],y);g.stroke();});
  xs.forEach(x=>{g.beginPath();g.moveTo(x,top);g.lineTo(x,ys[ys.length-1]);g.stroke();});
  const FIT=(t,maxW,px,bold)=>{let q=px;while(q>16){g.font=(bold?'bold ':'')+q+'px Georgia,serif';if(g.measureText(t).width<=maxW)break;q--;}return q;};
  labels.forEach((l,i)=>{const q=FIT(l,xs[i+1]-xs[i]-18,30,true);T(l,xs[i]+10,top+hdrH/2,'bold '+q+'px Georgia,serif');});
  const fs=Math.round(rowH*0.62);
  M.rows.forEach((r,i)=>{
    const y=top+hdrH+i*rowH+rowH/2;
    T(String(r.n),xs[0]+10,y,fs+'px Georgia,serif');
    const nm=r.s||r.nom,qt=qcell(r),pu=nf(r.pu),tt=nf(r.tot);
    T(nm,xs[1]+10,y,'bold '+FIT(nm,xs[2]-xs[1]-18,fs,true)+'px Georgia,serif');
    T(qt,xs[2]+10,y,FIT(qt,xs[3]-xs[2]-18,fs,false)+'px Georgia,serif');
    T(pu,xs[3]+10,y,FIT(pu,xs[4]-xs[3]-18,fs,false)+'px Georgia,serif');
    T(tt,xs[4]+10,y,FIT(tt,xs[5]-xs[4]-18,fs,false)+'px Georgia,serif');
  });
  let y=ys[ys.length-1]+75;
  T('TOTAL MATERIEL',142,y,'28px Georgia,serif');T(nf(M.mat),560,y-2,'36px Georgia,serif');
  y+=78;T('MAIN D\u2019ŒUVRE',142,y,'28px Georgia,serif');T(nf(M.mo),560,y-2,'36px Georgia,serif');
  y+=82;T('TOTAL GÉNÉRAL',142,y,'bold 30px Georgia,serif','#1b4f9c');T(nf(M.total)+' FCFA',560,y-2,'bold 40px Georgia,serif','#1b4f9c');
  T('Montants en FCFA · devis estimatif, quantités calculées d\u2019après les plans',142,H-90,'22px Georgia,serif','#666');
}

  downloadBlob(new Blob([html],{type:'text/html'}),'devis-charpente.html');
  flash('Devis exporté : ouvre-le puis imprime-le en PDF.');
}

    NU('pPl','Longueur d\u2019une planche de rive (m)',dv.lPlanche)+NU('pGo','Longueur d\u2019une gouttière (m)',dv.lGout)+NU('pNo','Longueur d\u2019une noue (m)',dv.lNoue)+
    NU('pBa','Longueur d\u2019une bande de rive (m)',dv.lBande)+NU('pFa','Longueur d\u2019une faîtière (m)',dv.lFait)+
    NU('pTe','Un tendeur de gouttière tous les (m)',dv.tendE)+NU('pNa','Une naissance de gouttière tous les (m)',dv.naissE)+
    NU('pLw','Largeur d\u2019une tôle lisse (m)',dv.lisseW)+NU('pLc','Chute de tôle lisse (%)',dv.lisseChute)+
    '<p class="note">Règles appliquées : tôle lisse = périmètre de la maison × débord + chute ; fixations, toiturol, rivets et pointes selon le type de tôle choisi ; pointes de 80 pour les fermes, de 90 pour les pannes ; un support de gouttière tous les 0,7 m. Main d\u2019œuvre : 18,6 % est le rapport de ton modèle (350 000 sur 1 884 000).</p>'+
    '<div class="nav"><button id="nBack">← Récapitulatif</button></div>');
  const refresh=()=>{
    const M=devisModel();
    $('vRows').innerHTML=M.rows.map(r=>'<div class="cut"><b>'+r.n+'. '+escH(r.nom)+'</b><br>'+
      '<input class="vq" data-k="'+r.k+'" type="text" inputmode="decimal" value="'+String(r.q).replace('.',',')+'" style="width:78px;display:inline-block;margin:0 4px"> '+r.u+' × '+
      '<input class="vp" data-k="'+r.k+'" type="text" inputmode="decimal" value="'+r.pu+'" style="width:96px;display:inline-block;margin:0 4px"> = <b id="vt_'+r.k+'">'+nf(r.tot)+'</b></div>').join('');
    $('vMat').textContent=nf(M.mat);$('vMo').textContent=nf(M.mo);$('vTot').innerHTML='<b>'+nf(M.total)+' FCFA</b>';
    sheetBody.querySelectorAll('input.vq').forEach(inp=>inp.oninput=()=>{
      const v=parseFloat(String(inp.value).replace(/\s/g,'').replace(',','.'));
      if(String(inp.value).trim()===''||!isFinite(v))delete dv.q[inp.dataset.k];else dv.q[inp.dataset.k]=v;
      tot();
    });
    sheetBody.querySelectorAll('input.vp').forEach(inp=>inp.oninput=()=>{

      opts.prix[inp.dataset.k]=isFinite(v)?v:0;tot();

  };
  const tot=()=>{
    const M=devisModel();
    M.rows.forEach(r=>{const e=$('vt_'+r.k);if(e)e.textContent=nf(r.tot);});
    $('vMat').textContent=nf(M.mat);$('vMo').textContent=nf(M.mo);$('vTot').innerHTML='<b>'+nf(M.total)+' FCFA</b>';
    scheduleSave();
  };
  refresh();
  const T=(id,key)=>{$(id).oninput=e=>{dv[key]=e.target.value;scheduleSave();};};
  T('vNom','nom');T('vTel','tel');T('vTit','titre');T('vCli','client');T('vPro','projet');
  const num=(id,key,min,max)=>{$(id).oninput=e=>{const v=parseFloat(String(e.target.value).replace(',','.'));if(isFinite(v)&&v>=min&&v<=max){dv[key]=v;refresh();scheduleSave();}};};
  num('vMoV','moVal',0,100000000);num('pPl','lPlanche',0.5,12);num('pGo','lGout',0.5,12);num('pNo','lNoue',0.5,12);num('pBa','lBande',0.5,12);num('pFa','lFait',0.5,12);
  num('pTe','tendE',0.1,3);num('pNa','naissE',1,60);num('pLw','lisseW',0.1,3);num('pLc','lisseChute',0,50);
  sheetBody.querySelectorAll('button[data-mm]').forEach(b=>b.onclick=()=>{
    dv.moMode=b.dataset.mm;
    dv.moVal=dv.moMode==='pct'?18.6:(dv.moMode==='m2'?2000:350000);
    scheduleSave();openDevis();
  });
  $('vReset').onclick=()=>{dv.q={};openDevis();};
  $('vPng').onclick=exportDevisPng;$('vHtml').onclick=exportDevisHtml;
  $('vCopy').onclick=()=>{
    const t=devisText();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>flash('Devis copié.'),()=>flash('Copie impossible.'));
    else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash('Devis copié.');}catch(e){flash('Copie impossible.');}ta.remove();}
  };
  $('vWa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(devisText()),'_blank');
  $('vLogo').onclick=()=>$('vFile').click();
  $('vLogoX').onclick=()=>{try{localStorage.removeItem(LS_LOGO);}catch(e){}flash('Logo retiré.');};
  $('vFile').onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const im=new Image();
    im.onload=()=>{
      const r=Math.min(1,360/Math.max(im.width,im.height)),c2=document.createElement('canvas');
      c2.width=Math.round(im.width*r);c2.height=Math.round(im.height*r);
      c2.getContext('2d').drawImage(im,0,0,c2.width,c2.height);
      if(lsSet(LS_LOGO,c2.toDataURL('image/png')))flash('Logo enregistré.');else flash('Logo trop lourd pour la mémoire.');
    };
    im.src=URL.createObjectURL(f);
  };
  $('nBack').onclick=()=>$('bRecap').onclick();
}

/* ---------- vérification indicative des sections ---------- */
const BOIS=[['Générique',10,9000],['Ayous',8,8500],['Fraké',9,9500],['Iroko',11,10500],['Sapelli',12,11000],['Azobé',18,17000]];
const POIDS_COUV={bac:0.06,ondulee:0.07,tuiles:0.45,metro:0.07};
function dimRows(){
  const sig=opts.dsig||10,E=opts.dE||9000,qv=(opts.dqv==null?0.5:opts.dqv);
  const k=Math.sqrt(1+res.slope*res.slope);
  const qk=(POIDS_COUV[opts.couv]||0.07)+0.10+qv;                 // kN par m² de rampant
  const calc=(nom,b,h,L,w)=>{
    const Wm=b*h*h/6,Im=b*h*h*h/12,EkN=E*1000;
    const M=w*L*L/8,sg=M/Wm/1000,dl=5*w*Math.pow(L,4)/(384*EkN*Im);
    const Ls=Math.sqrt(8*sig*1000*Wm/w),Ld=Math.cbrt(384*EkN*Im/(1000*w));
    const rs=sg/sig,rd=dl/(L/200),r=Math.max(rs,rd);
    return{nom,L,w,sg,dl,rs,rd,Lmax:Math.min(Ls,Ld),v:r<=1?'OK':(r<=1.15?'Limite':'Insuffisant')};
  };
  const bl=opts.latChant===false?[0.08,0.04]:[0.04,0.08];
  return{qk,sig,E,k,rows:[
    calc('Latte 8 × 4 ('+(opts.latChant===false?'à plat':'sur chant')+') entre deux fermes',bl[0],bl[1],opts.fermes,qk*opts.lattes),
    calc('Arbalétrier 12 × 4 (sur chant) entre deux fiches',0.04,0.12,opts.fiches*k,qk*opts.fermes)
  ]};
}
function dimHtml(){
  const D=dimRows(),f=fmt;
  const col={OK:'#7fd18b',Limite:'#ffd08a',Insuffisant:'#ff8a80'};
  let h='<div class="row"><span>Charge retenue (couverture + bois + variable)</span><span>'+f(D.qk)+' kN/m²</span></div>';
  D.rows.forEach((r,i)=>{
    h+='<div class="cut"><b>'+r.nom+'</b> · <b style="color:'+col[r.v]+'">'+r.v+'</b><br>'+
      'portée '+f(r.L)+' m · charge '+f(r.w)+' kN/m<br>'+
      'contrainte '+f(r.sg)+' / '+f(D.sig)+' MPa · flèche '+f(r.dl*1000)+' mm (limite '+f(r.L/200*1000)+' mm)<br>'+
      'portée maximale conseillée : <b>'+f(i===0?r.Lmax:r.Lmax/D.k)+' m</b>'+(i===0?' (espacement des fermes)':' (espacement des fiches à l\u2019horizontale)')+'</div>';
  });
  return h;
}
function openDim(){
  if(!res)return;
  const D=dimRows();
  openSheet('<h3>Vérification des sections</h3>'+
    '<p class="note">Calcul simplifié et indicatif : poutre sur deux appuis, charge répartie, flexion et flèche (L/200). Ni vent ascendant, ni flambement, ni assemblages. À faire valider par un ingénieur ou un bureau d\u2019études pour un ouvrage important.</p>'+
    '<h4>Bois</h4><div class="shapes">'+BOIS.map((b,i)=>'<button data-b="'+i+'" class="'+((D.sig===b[1]&&D.E===b[2])?'on':'')+'">'+b[0]+'</button>').join('')+'</div>'+
    '<label style="margin-top:8px">Contrainte admissible en flexion (MPa)<input id="dSig" type="text" inputmode="decimal" value="'+String(D.sig).replace('.',',')+'"></label>'+
    '<label>Module d\u2019élasticité E (MPa)<input id="dE" type="text" inputmode="decimal" value="'+D.E+'"></label>'+
    '<label>Charge variable : vent, pluie, entretien (kN/m²)<input id="dQ" type="text" inputmode="decimal" value="'+String(opts.dqv).replace('.',',')+'"></label>'+
    '<label>Lattes posées sur chant (8 cm de haut)<input id="dCh" type="checkbox" '+(opts.latChant!==false?'checked':'')+'></label>'+
    '<div id="dRes">'+dimHtml()+'</div>'+
    '<p class="note">Valeurs des essences indicatives et prudentes : remplace-les par celles de ton fournisseur.</p>'+
    '<div class="nav"><button id="nBack">← Récapitulatif</button></div>');
  const upd=()=>{$('dRes').innerHTML=dimHtml();};
  const num=id=>parseFloat(String($(id).value).replace(',','.'));
  $('dSig').oninput=()=>{const v=num('dSig');if(v>0&&v<80){opts.dsig=v;upd();}};
  $('dE').oninput=()=>{const v=num('dE');if(v>500&&v<40000){opts.dE=v;upd();}};
  $('dQ').oninput=()=>{const v=num('dQ');if(v>=0&&v<5){opts.dqv=v;upd();}};
  $('dCh').onchange=()=>{opts.latChant=$('dCh').checked;upd();};
  sheetBody.querySelectorAll('button[data-b]').forEach(b=>b.onclick=()=>{const q=BOIS[Number(b.dataset.b)];opts.dsig=q[1];opts.dE=q[2];openDim();});
  $('nBack').onclick=()=>$('bRecap').onclick();
}

/* ---------- dossier complet à imprimer / envoyer ---------- */
function exportDossier(){
  if(!res){flash('Dessine et ferme un contour d\u2019abord.');return;}
  draw();
  const planImg=cv.toDataURL('image/png');
  let img3d=null;
  if(gl){try{render3D();img3d=glcv.toDataURL('image/png');}catch(e){img3d=null;}}
  const list=res.chains.filter(c=>c.g);
  let ci=0;list.forEach((c,i)=>{if(c.end==='eave'&&c.g.entLen>list[ci].g.entLen)ci=i;});
  let coupe=null;
  if(list.length){const c2=document.createElement('canvas');c2.width=680;c2.height=360;drawCoupe(c2,list[ci]);coupe=c2.toDataURL('image/png');}
  const grab=fn=>{fn();const d=document.createElement('div');d.innerHTML=sheetBody.innerHTML;d.querySelectorAll('.nav,label,button,canvas,input,h3,.shapes').forEach(n=>n.remove());return d.innerHTML;};
  const recap=grab(()=>$('bRecap').onclick()),debit=grab(openDebit),tole=grab(openTole),dm=grab(openDim);
  closeSheet();
  const s=res.stats,dt=new Date().toLocaleDateString('fr-FR');
  const html='<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dossier de charpente</title><style>'+
    'body{font-family:system-ui,Arial,sans-serif;max-width:820px;margin:0 auto;padding:18px;color:#1c2630;line-height:1.45}'+
    'h1{margin:0 0 4px}h2{border-bottom:2px solid #c9803f;padding-bottom:4px;margin-top:28px}h4{margin:16px 0 6px;color:#7a4a1c}'+
    '.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd;padding:4px 0}.cut{border-left:3px solid #c9803f;background:#f6f1ea;padding:6px 10px;margin:6px 0;font-size:14px}'+
    '.note{color:#666;font-size:13px}img{max-width:100%;border:1px solid #ccc;border-radius:6px}.dark{background:#0f2639}'+
    '@media print{h2{page-break-before:auto}.cut,.row{break-inside:avoid}}</style></head><body>'+
    '<h1>Dossier de charpente</h1><div class="note">Établi le '+dt+' · pente '+Math.round(opts.pente)+' % · débord '+fmt(opts.debord)+' m · fermes tous les '+fmt(opts.fermes)+' m · '+COUV[opts.couv].nom+'</div>'+
    '<h2>Plan de charpente</h2><img src="'+planImg+'" alt="Plan">'+
    (img3d?'<h2>Vue 3D</h2><img src="'+img3d+'" alt="3D">':'')+
    (coupe?'<h2>Coupe de la ferme principale</h2><img class="dark" src="'+coupe+'" alt="Coupe">':'')+
    '<h2>Récapitulatif</h2>'+recap+'<h2>Plan de débit</h2>'+debit+'<h2>Couverture</h2>'+tole+
    '<h2>Vérification des sections</h2>'+dm+'<h2>Devis</h2>'+devisTableHtml(devisModel())+
    '</body></html>';
  downloadBlob(new Blob([html],{type:'text/html'}),'dossier-charpente.html');
  flash('Dossier exporté : ouvre-le puis imprime-le en PDF.');
}

/* ---------- Démarrage ---------- */
function resize(){
  const r=wrap.getBoundingClientRect();
  dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  glcv.width=W*dpr;glcv.height=H*dpr;glcv.style.width=W+'px';glcv.style.height=H+'px';
  if(dimsOpen&&!mode3d)fit();
  draw();
}
window.addEventListener('resize',resize);
resize();
(function(){const a=lsGet(LS_AUTO);if(!(a&&applySnapshot(a)))loadPreset('Forme en L');})();
